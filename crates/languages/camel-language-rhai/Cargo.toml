serde_json = { workspace = true, features = ["raw_value", "preserve_order"] }
serde = { workspace = true }
indexmap = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }

[lints]
workspace = true
