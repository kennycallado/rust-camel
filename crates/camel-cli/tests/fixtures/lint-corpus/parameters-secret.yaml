# Corpus fixture: a secret option supplied via a sibling `parameters:` map
# (rather than the URI query string) must be flagged by R-SECRET with a span
# inside the map. Benign entries — a non-secret http option and a plain log
# option — must emit nothing (zero false positives on clean entries).
routes:
  - id: "parameters-secret-http"
    from: "timer:tick"
    steps:
      - to: "http://example.com"
        parameters:
          authPassword: hunter2
          userAgent: camel-lint-corpus
      - to: "log:info"
        parameters:
          showBody: "true"
