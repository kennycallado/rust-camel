[package]
name = "camel-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for Apache Camel in Rust"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/camel-cli"
readme = "README.md"
keywords = ["camel", "cli", "integration", "messaging"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.camel-bundles]
boot-consumer = true

[lib]
name = "camel_cli"
path = "src/lib.rs"

[[bin]]
name = "camel"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
blake3.workspace = true
chrono.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
config.workspace = true
glob.workspace = true
humantime.workspace = true
include_dir = "0.7"
noyalib.workspace = true
percent-encoding.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio-util.workspace = true
tokio.workspace = true
toml.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
tower = { workspace = true, features = ["util"] }
camel-api.workspace = true
camel-bean.workspace = true
camel-bundles.workspace = true
camel-integration-test.workspace = true
camel-dsl.workspace = true
camel-core.workspace = true
camel-matchers.workspace = true
camel-config = { workspace = true, features = ["otel", "kubernetes"] }
camel-component-api.workspace = true
camel-component-container.workspace = true
camel-component-controlbus.workspace = true
camel-component-direct.workspace = true
camel-component-seda.workspace = true
camel-component-file.workspace = true
camel-component-http.workspace = true
camel-component-jms.workspace = true
camel-component-kafka = { workspace = true, optional = true }
camel-component-mqtt = { workspace = true, optional = true }
camel-component-grpc = { workspace = true, optional = true }
camel-component-log.workspace = true
camel-component-mock.workspace = true
camel-component-opensearch = { workspace = true }
camel-master = { workspace = true }
camel-component-redis.workspace = true
camel-component-sql.workspace = true
camel-component-cron.workspace = true
camel-component-timer.workspace = true
camel-component-validator.workspace = true
camel-component-ws.workspace = true
camel-dataformat-protobuf = { workspace = true, optional = true }
camel-proto-compiler = { workspace = true, optional = true }
camel-xslt = { workspace = true }
camel-xj = { workspace = true }
camel-template = { workspace = true }
camel-component-wasm = { workspace = true, optional = true }
camel-component-llm = { workspace = true, optional = true }
camel-component-mcp = { workspace = true, optional = true }
camel-component-cxf = { workspace = true }
camel-function = { workspace = true }
camel-wit.workspace = true
camel-lint.workspace = true
camel-lsp = { workspace = true, optional = true }
tower-lsp = { workspace = true, optional = true }
ariadne.workspace = true
rustls.workspace = true
camel-component-surrealdb = { workspace = true, optional = true }
camel-component-exec = { workspace = true, optional = true }
# Global allocator backends (binary-only; library crates must never set one).
# tikv-jemalloc-sys builds jemalloc from source, so keep default features off
# (no background_threads_runtime_support) for the leanest musl-friendly build.
# Version floor 0.7 (= jemalloc 5.3.1): its configure script derives LG_PAGE
# from the TARGET triple (aarch64-linux gets 64K; x86_64 detects 4K natively).
# 0.6 baked the build-host page size when cross-compiling, which produces a
# binary that aborts at startup on 64K-page aarch64 kernels (RHEL 9 family).
# "stats" re-enables jemalloc's own default statistics (--enable-stats) so
# the release verify gate can dump allocator config via MALLOC_CONF=
# stats_print:true; negligible cost, and rc-vnm8 soak observability wants it.
# "profiling" compiles heap-profiling support in (--enable-prof), but it is
# OFF unless MALLOC_CONF=prof:true at process start — a startup opt-in
# (pod restart), NOT a mid-flight toggle; runtime prof.active switching
# would need extra machinery. When active, dumps go via jemalloc ctl
# `prof.dump`. Verification of musl/aarch64 + the k8s dump path is PARKED
# to the human-dispatched musl-jemalloc-verify workflow (bd rc-i9f9).
tikv-jemallocator = { version = "0.7", optional = true, default-features = false, features = ["stats", "profiling"] }
# must stay in lockstep with tikv-jemallocator 0.7
tikv-jemalloc-ctl = { version = "0.7", optional = true, default-features = false, features = ["use_std", "stats", "profiling"] }

[dev-dependencies]
# camel-auth is test-only here (run_tests.rs / test/scenario.rs mod
# tests exercise the shared security builder's provider registry).
# camel-processor is test-only here (bench_instrument tests construct
# BuilderStep::Log fixtures, whose level field is camel_processor::LogLevel).
camel-processor.workspace = true
camel-auth.workspace = true
tempfile = { workspace = true }
serde_json.workspace = true
ron = { workspace = true }

[features]
default = ["flavor-regular"]
# `full` = the historical `default` set plus the language adapters and the
# LSP server. Those were previously unconditional dependencies, so the union
# reproduces today's default closure exactly (golden fixture proof:
# tests/feature_profiles.rs::default_closure_matches_golden). Slim profiles
# start from `--no-default-features`.
full = ["otel", "grpc", "wasm", "http-static", "llm", "surrealdb", "exec", "mqtt", "mcp", "integration-http", "integration-sql", "security", "redis-tls", "lsp", "lang-js", "lang-rhai", "lang-jsonpath", "lang-xpath", "lang-minijinja"]
# LSP server surface (`camel lsp`): tower-lsp transport + camel-lsp backend.
lsp = ["dep:camel-lsp", "dep:tower-lsp"]
# Language adapter forwarding features (camel-core compiles them in).
lang-js = ["camel-core/lang-js"]
lang-rhai = ["camel-core/lang-rhai"]
lang-jsonpath = ["camel-core/lang-jsonpath"]
lang-xpath = ["camel-core/lang-xpath"]
lang-minijinja = ["camel-core/lang-minijinja"]
# Flavor markers are the single selection surface for profiles; priority when
# several are enabled is full > regular > slim; builds with no marker report
# `custom`; bodies in this change are aliases only (content curation is the
# flavor-matrix change).
flavor-slim = ["slim-http"]
flavor-regular = ["full"]
flavor-full = ["full", "kafka"]
# slim-benchmarks is the renamed slim-http (owner ruling 2026-09-17:
# benchmark-oriented baseline); the alias below keeps existing legs
# building for one release.
slim-benchmarks = []
# One-release alias (drop at 0.50).
slim-http = ["slim-benchmarks"]
otel = ["camel-component-http/otel", "camel-component-ws/otel"]
# security forwards to the shared security-boot builder in camel-bundles
# (scenario-shared-boot): default-on so `camel run` default builds keep
# the security builder available (runtime-boot "feature forwarding with
# default enablement").
security = ["camel-bundles/security"]
# kafka is the capability feature: activates the kafka component and
# its registration in the lint registry and the boot cascade. It
# forwards camel-component-kafka/cmake-build so librdkafka builds
# from source via cmake: cmake is portable across Windows and cross
# targets, the rdkafka-sys default (mklove/sh) is not (rc-2ii8l).
# dynamic-linking selects a system librdkafka instead and implies
# kafka.
kafka = ["dep:camel-component-kafka", "camel-bundles/kafka", "camel-component-kafka/cmake-build"]
grpc = [
  "dep:camel-component-grpc",
  "dep:camel-dataformat-protobuf",
  "dep:camel-proto-compiler",
  "camel-dsl/protobuf",
  "camel-bundles/grpc",
]
wasm = ["dep:camel-component-wasm", "camel-bundles/wasm"]
# LLM component. Default enables mock plus all real providers (openai,
# ollama) so the release binary works with real models out of the box.
llm = ["dep:camel-component-llm", "camel-component-llm/all-providers", "camel-bundles/llm"]
# MCP component (Model Context Protocol, scheme `mcp:`): Consumer (server)
# tool/resource routes + Producer (client) call/read dispatch.
mcp = ["dep:camel-component-mcp", "camel-bundles/mcp"]
http-static = ["camel-bundles/http-static"]
dynamic-linking = ["kafka", "camel-component-kafka/dynamic-linking"]
# mqtt activates the MQTT component (rumqttc, no TLS by default).
# Use mqtt-tls to enable TLS support (mqtts:// URIs).
mqtt = ["dep:camel-component-mqtt", "camel-bundles/mqtt"]
mqtt-tls = ["mqtt", "camel-component-mqtt/tls"]
# Redis TLS, default-on: the component auto-upgrades non-loopback hosts to
# TLS (secure-by-default), so a binary without TLS support hard-fails against
# every remote Redis instance. Pure-rust webpki roots — no native deps, so
# release cross-compilation is unaffected. bd rc-ayy11.
redis-tls = ["camel-component-redis/tls"]
surrealdb = ["dep:camel-component-surrealdb", "camel-bundles/surrealdb"]
# exec activates the fail-closed system command execution component.
exec = ["dep:camel-component-exec"]
# Integration-tier HTTP partner activation (ADR-0069 §8): non-default
# and demand-gated. The scenario harness itself is always present;
# without this feature, scenario endpoints of scheme http keep the
# infra-unavailable path.
integration-http = ["camel-integration-test/http", "camel-integration-test/security"]
# Integration-tier `sql:` action activation (bd rc-25lup.1, ADR-0069 §8
# demand-gating): forwards to the harness's sql feature. Independent of
# `integration-http` — an sql-only build runs full-boot documents whose
# only actions are `sql:`.
integration-sql = ["camel-integration-test/sql"]
# Test-only: the e2e suites that spawn the real `camel` binary against
# scenario documents stay out of the default suite (runtime and spawn
# cost); the integration-http CI job enables them explicitly.
itest-e2e = []
# Global allocator override for the `camel` release binary. Single path:
# jemalloc is the only allocator override (the alternative backend feature
# was removed as dead surface). Soak/migration plan: bd rc-vnm8.
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]

[lints]
workspace = true
