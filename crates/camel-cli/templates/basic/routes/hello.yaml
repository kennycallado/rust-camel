# Sample route for camel test — see routes/hello.test.yaml
# The send to `log:done` is intercepted by the test document and diverted
# to `mock:result`, so no component dependency is needed to assert on it.
routes:
  - id: "hello"
    from: "direct:start"
    steps:
      - set_header:
          key: "source"
          value: "hello"
      # Script steps read their body from a file. The path is relative to this
      # route file; the .rhai extension picks the language.
      - script:
          source_file: ../scripts/hello.rhai
      - to: "log:done"
