[package]
name = "camel-bundles"
description = "Component-bundle registration cascade and boot lifecycle handle for rust-camel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/camel-bundles"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
async-trait.workspace = true
camel-api.workspace = true
camel-config.workspace = true
camel-component-api.workspace = true
camel-core.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
camel-component-container = { workspace = true, optional = true }
camel-component-controlbus.workspace = true
camel-component-cron.workspace = true
camel-component-cxf = { workspace = true, optional = true }
camel-component-direct.workspace = true
camel-component-file.workspace = true
camel-component-http.workspace = true
camel-component-jms = { workspace = true, optional = true }
camel-component-log.workspace = true
camel-component-mock.workspace = true
camel-component-opensearch = { workspace = true, optional = true }
camel-component-redis = { workspace = true, optional = true }
camel-component-seda.workspace = true
camel-component-sql = { workspace = true, optional = true }
camel-component-stream.workspace = true
camel-component-timer.workspace = true
camel-component-validator.workspace = true
camel-component-ws = { workspace = true, optional = true }
camel-master.workspace = true
camel-template.workspace = true
camel-xj = { workspace = true, optional = true }
camel-xslt = { workspace = true, optional = true }
# Feature-gated bundles; gates mirror the `camel run` cfg lines 1:1
# (ADR-0069 section 10). `kafka` and `security` stay opt-in; the rest are
# default-on.
camel-component-grpc = { workspace = true, optional = true }
camel-component-kafka = { workspace = true, optional = true }
camel-component-llm = { workspace = true, optional = true }
camel-component-mcp = { workspace = true, optional = true }
camel-component-mqtt = { workspace = true, optional = true }
camel-component-surrealdb = { workspace = true, optional = true }
camel-component-wasm = { workspace = true, optional = true }
# Security builder (task 2.2): auth stack behind the `security` feature.
# serde_json is needed by the moved builder (`native_principal` constructs
# the empty claims object), so it rides the same optional gate.
camel-auth = { workspace = true, optional = true }
camel-component-keycloak = { workspace = true, optional = true }
camel-dsl = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
# Startup log-noise regression test captures fmt-layer output through a
# custom MakeWriter (bd rc-k56el).
tracing-subscriber.workspace = true
# Test-only fixtures for the moved security-builder tests (signed-JWT and
# timestamp claims); never linked into the library.
chrono.workspace = true
jsonwebtoken.workspace = true

[features]
default = ["grpc", "wasm", "http-static", "llm", "surrealdb", "mqtt", "mcp", "jms", "sql", "redis", "opensearch", "ws", "cxf", "xj", "xslt"]
# http-static gates the HttpStaticBundle registration only (its pre-115
# meaning); the eight bridges are per-bridge gates forwarded by camel-cli
# (mission 121, rc-9720m).
http-static = []
jms = ["dep:camel-component-jms"]
sql = ["dep:camel-component-sql"]
redis = ["dep:camel-component-redis"]
opensearch = ["dep:camel-component-opensearch"]
ws = ["dep:camel-component-ws"]
cxf = ["dep:camel-component-cxf"]
xj = ["dep:camel-xj"]
xslt = ["dep:camel-xslt"]
kafka = ["dep:camel-component-kafka"]
# containers gates the ContainerBundle registration (the `container:`
# scheme); forwarded by camel-cli's same-named gate — one feature with
# camel-function (function⇒container per ADR-0005).
containers = ["dep:camel-component-container"]
mqtt = ["dep:camel-component-mqtt"]
surrealdb = ["dep:camel-component-surrealdb"]
grpc = ["dep:camel-component-grpc"]
llm = ["dep:camel-component-llm"]
mcp = ["dep:camel-component-mcp"]
wasm = ["dep:camel-component-wasm"]
security = ["dep:camel-auth", "dep:camel-component-keycloak", "dep:camel-dsl", "dep:serde_json"]

[lints]
workspace = true
