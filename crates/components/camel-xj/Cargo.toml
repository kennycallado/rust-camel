[package]
name = "camel-xj"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "XJ (XML <-> JSON) Data Format for Rust Camel (via xml-bridge)"
readme = "README.md"

[dependencies]
camel-api = { workspace = true }
camel-component-api = { workspace = true }
camel-bridge = { workspace = true } # TODO(XJ-002): consider making bridge dep optional via feature flag
camel-xslt = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "time", "rt-multi-thread"] }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
tower = { workspace = true }
tonic = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
camel-component-api = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros"] }
tonic = { workspace = true }
serde_json = { workspace = true }
rustls = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }

[lints]
workspace = true
