[package]
name = "camel-component-mcp"
description = "MCP (Model Context Protocol) tools + resources server and client over Streamable HTTP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/camel-component-mcp"

keywords.workspace = true
categories.workspace = true

[dependencies]
camel-api = { workspace = true }
camel-auth = { workspace = true }
camel-component-api = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
axum-server = { version = "0.7", features = ["tls-rustls"] }
http = { workspace = true }
tokio = { workspace = true }
tokio-rustls = "0.26"
rustls-pemfile = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
tower = { workspace = true }
toml = { workspace = true }
rmcp = { workspace = true }
jsonschema = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
camel-auth = { workspace = true }
camel-builder = { workspace = true }
camel-component-api = { workspace = true, features = ["test-support"] }
camel-dsl = { workspace = true }
percent-encoding = { workspace = true }
rustls = { workspace = true }
tokio-util = { workspace = true }
tracing-subscriber = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
