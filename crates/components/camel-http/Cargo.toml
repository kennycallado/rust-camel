[package]
name = "camel-component-http"
description = "HTTP client component for rust-camel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/camel-component-http"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
arc-swap.workspace = true
camel-api.workspace = true
camel-component-api.workspace = true
camel-auth.workspace = true
async-trait.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
thiserror.workspace = true
tracing.workspace = true
reqwest.workspace = true
serde_json.workspace = true
bytes.workspace = true
moka.workspace = true
axum.workspace = true
http.workspace = true
http-body.workspace = true
tokio-util.workspace = true
url = { workspace = true }
camel-otel = { workspace = true, optional = true }
futures = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
base64.workspace = true
axum-server = { version = "0.8", features = ["tls-rustls"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
rustls.workspace = true
# Bundled Mozilla roots for the CA-less-platform client fallback (rc-3j4mq).
# Precedent: camel-cli redis-tls pure-rust webpki roots (rc-ayy11).
webpki-roots = "1"
# Expired-cert allowlist (bd rc-ishar): SHA-256 pinning of end-entity DERs.
sha2.workspace = true
hex.workspace = true
rustls-webpki = "0.103"

[features]
otel = ["dep:camel-otel"]

[dev-dependencies]
camel-component-api = { workspace = true, features = ["test-support"] }
camel-language-api = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
# Publish-order-safe only while camel-core does NOT weak-depend back (ADR-0055).
# lint-publish-cycles guards this; re-add a core→http dev-dep and this cycles again.
camel-core = { workspace = true }
# End-to-end provenance acceptance tests drive the real route writers (bd
# rc-tf0k4). Neither crate depends on camel-component-http, so the publish
# graph stays acyclic (lint-publish-cycles guards this).
camel-processor = { workspace = true }
camel-builder = { workspace = true }
tempfile = { workspace = true }
flate2 = { workspace = true }
tracing-test = { workspace = true, features = ["no-env-filter"] }
rcgen = { workspace = true }
criterion.workspace = true

[[bench]]
name = "registry"
harness = false

[lints]
workspace = true
