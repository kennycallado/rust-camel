[package]
name = "camel-component-api"
description = "Component API trait and registry for rust-camel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/camel-component-api"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
camel-api.workspace = true
camel-auth.workspace = true
camel-language-api.workspace = true
camel-endpoint.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
toml.workspace = true
serde    = { workspace = true, features = ["derive"] }
tracing  = { workspace = true }
rand     = { workspace = true }
chrono   = { workspace = true }
chrono-tz = { workspace = true }
rcgen    = { version = "0.14", optional = true }
rustls = { workspace = true }
rustls-pemfile = "2"

[features]
default = []
# Enables `test_support` module + `PanicRuntimeObservability` for downstream
# crates' test code. NEVER enable in production — the stub panics on use.
test-support = ["dep:rcgen"]

[dev-dependencies]
serde_json.workspace = true
tracing-subscriber = { workspace = true }
# Path-only self dev-dep (cargo strips it on publish). `workspace = true`
# here would inherit `version = "=0.26.0"` and break publish — match the
# camel-component-cxf pattern. See xtask publish-order self-ref filter.
camel-component-api = { path = ".", features = ["test-support"] }

[lints]
workspace = true
