[package]
name = "camel-template"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "External template component for rust-camel (ADR-0047 Stage 2)"

[dependencies]
camel-api = { workspace = true }
camel-component-api = { workspace = true }
camel-language-api = { workspace = true }
camel-language-minijinja = { workspace = true }
minijinja = { workspace = true }
arc-swap = { workspace = true }
blake3 = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
async-trait = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tower = { workspace = true }
url = { workspace = true }
regex = { workspace = true }
futures = { workspace = true }
toml = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
camel-component-api = { workspace = true, features = ["test-support"] }
camel-core = { workspace = true }
camel-builder = { workspace = true }
camel-component-direct = { workspace = true }
tempfile = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
tower = { workspace = true }

[lints]
workspace = true
