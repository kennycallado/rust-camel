[package]
name = "camel-component-jms"
description = "JMS component for rust-camel via Java bridge"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["camel", "jms", "activemq", "artemis", "messaging"]
categories = ["network-programming", "asynchronous"]

[dependencies]
camel-component-api = { workspace = true }
camel-api       = { workspace = true }
camel-bridge    = { workspace = true }
tonic           = { workspace = true }
tonic-prost     = { workspace = true }
prost           = { workspace = true }
tokio           = { workspace = true }
async-trait     = { workspace = true }
tower           = { workspace = true }
tracing         = { workspace = true }
bytes           = { workspace = true }
serde_json      = { workspace = true }
uuid            = { workspace = true }
futures         = { workspace = true }
tokio-util      = { workspace = true }
dashmap         = { workspace = true }
serde           = { workspace = true }
toml            = { workspace = true }
sha2            = { workspace = true }
hex             = { workspace = true }
camel-otel      = { workspace = true, optional = true }

[features]
otel = ["dep:camel-otel"]

[dev-dependencies]
camel-component-api = { workspace = true, features = ["test-support"] }
tokio-stream     = { workspace = true }
tempfile         = { workspace = true }
tracing-subscriber = { workspace = true }
# Test-only: install the process-level CryptoProvider required by rustls 0.23
# when the private start_bridge_process test reaches its mTLS connect phase.
rustls           = { workspace = true }
# Test-only: compile/execute schemas/jms-pool-health-config.json against the
# runtime health contract. Never a production dependency.
jsonschema       = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }
protox.workspace = true

[lints]
workspace = true
