# Inbound consumer scenario (ADR-0069 sections 4-5, rc-5yon): the
# partner plays CLIENT — the `send` performs a real HTTP request into
# the booted consumer route, and the `receive` awaits the SUT's
# response (client role: the response parked by the send). Status
# validation lives here: responses, not requests, carry status.
#
# The consumer address is never pinned: the `inbound:` section has the
# boot stage a port-0 listener and resolve the route file's
# `${env:INBOUND}` to the bound URL, and the test fills the same
# `INBOUND` run variable from the outcome's `inbound_bound`.
routeFiles:
  - routes/consumer.yaml
profile: default
inbound:
  bindVar: INBOUND
scenario:
  - send:
      to: ${INBOUND}/in
      body: partner-request-5f2c
      headers:
        X-Scenario-Tag: e2e-inbound
  - receive:
      from: ${INBOUND}/in
      deadline: 2s
      extract:
        status: status
        replyRole: headers.X-Scenario-Role
  - validate:
      target: { variable: status }
      expectation: 201
  - validate:
      target: { variable: replyRole }
      expectation: sut
  - validate:
      target:
        lastReceived: ${INBOUND}/in
      expectation: inbound-acknowledged
