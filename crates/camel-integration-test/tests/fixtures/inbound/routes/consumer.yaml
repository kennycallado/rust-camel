# Inbound consumer fixture route (ADR-0069 sections 4-5, rc-5yon): the
# system under test CONSUMES http — the consumer binds the listener
# staged by the document's `inbound:` section at `ctx.start()` (rc-w1u9:
# Explicit startup mode, `mark_ready` after bind, so the harness may
# connect the moment the boot returns).
#
# The route pins no port: `${env:INBOUND}` resolves through the
# scenario's layered environment at discovery to the full URL the boot
# staged (`http://127.0.0.1:<port>`, rc-5yon), never the process
# environment.
routes:
  - id: inbound-consumer
    from: ${env:INBOUND}/in
    steps:
      - set_header:
          key: CamelHttpResponseCode
          value: 201
      - set_header:
          key: X-Scenario-Role
          value: sut
      - set_body: inbound-acknowledged
