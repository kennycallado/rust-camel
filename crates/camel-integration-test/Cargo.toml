[package]
name = "camel-integration-test"
description = "Scenario document model, parser, and integration-tier test harness for rust-camel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/camel-integration-test"
keywords.workspace = true
categories.workspace = true

[dependencies]
camel-api.workspace = true
camel-core.workspace = true
camel-dsl.workspace = true
# The pure matcher algebra (expectation grammar, count bounds, and
# predicates) shared across test tiers (shared-matcher-core).
camel-matchers.workspace = true
futures.workspace = true
humantime.workspace = true
noyalib.workspace = true
regex.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
# FULL-tier scenario boot (boot_scenario): the sealed config loader and
# the `camel run` component-bundle cascade, so the scenario boots the
# real composition root (ADR-0069 sections 4-5, 10).
camel-bundles.workspace = true
camel-config.workspace = true
# DirectStimulus delivers route stimulus through the booted context's
# producer path — the same mechanism camel-test / camel run use.
camel-component-api.workspace = true
# Shared SEDA gate predicate (is_no_active_consumers_gate) for the
# stimulus retry loop: gate errors fail fast instead of retrying
# (rc-tgaxf, adopting rc-zjrx's landed predicate).
camel-component-seda.workspace = true
tower.workspace = true
# HTTP partner adapter (feature `http`): the same hyper 1 stack that
# sits under the workspace's reqwest users, driven directly so the
# partner plays both wire roles without a client framework.
# Inbound listener staging (rc-5yon, ADR-0070): the harness binds
# `127.0.0.1:0` and stages the listener on the HTTP component's global
# `ServerRegistry` pre-boot, so the scenario route's consumer consumes
# the staged socket and route URIs interpolate the bound address as a
# bindVar. Harness-side only — no camel-component-http edits.
camel-component-http = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true, features = ["http1", "client", "server"] }
hyper-util = { workspace = true, optional = true, features = ["tokio"] }
# Demand-gated SQL action activation (ADR-0069 §8, mirror of `http`):
# the scenario `sql:` action executor and its sqlx dependency compile
# only when scenarios prepare state through a datasource. The sqlite
# driver rides along for the in-memory executor tests.
sqlx = { workspace = true, optional = true, features = ["runtime-tokio", "any", "sqlite"] }
# Reply-value extraction for `expectReply` on `direct:` sends
# (rc-qvz6): the reply body converts to a `serde_json::Value` for
# the shared matcher verbs without the `http` feature.
serde_json.workspace = true
# Process-global log capture (rc-tdgh5): the registry + capture layer
# behind the scenario tier's document-level `logs:` assertions. The
# workspace feature set satisfies the registry minimum and lets the
# foreign-subscriber test build an fmt subscriber.
tracing-subscriber.workspace = true

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
toml.workspace = true
# Cross-surface byte-identity test (rc-l4wf): compares the camel-dsl YAML
# lowering against the camel-builder `.parameters()` merge. Test-only, so the
# authoring crates stay decoupled (no camel-builder dep inside camel-dsl).
camel-builder.workspace = true

[features]
# Shared security composition root (scenario-shared-boot task 3.1):
# when on, boot_scenario builds the security compile context through
# the camel-bundles builder; when off, any configured [security.*]
# section fails closed through ensure_security_supported.
security = ["camel-bundles/security"]
# Demand-gated HTTP activation (ADR-0069 §8): the HttpPartner adapter
# and its hyper dependency compile only when scenarios need scheme
# http endpoints.
http = [
    "dep:bytes",
    "dep:camel-component-http",
    "dep:http",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
]
# Demand-gated SQL action activation (ADR-0069 §8, mirror of `http`):
# the `sql:` action executor compiles only when scenarios prepare
# state through a datasource.
sql = ["dep:sqlx"]

[lints]
workspace = true
