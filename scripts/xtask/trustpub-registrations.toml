# Trusted publishing (trustpub) registration manifest.
#
# Maintainer-asserted lifecycle state per publishable workspace crate.
# `registered` asserts that crates.io trusted publishing is configured
# for the crate; crates.io does not expose trustpub configuration to any
# API check, so this file is the recorded source of truth for that
# claim. Entries are ordered exactly like `cargo xtask publish-order`;
# the offline gate `cargo xtask lint-publish-registration` enforces set
# and order drift. Case A (published-unregistered) and Case B
# (new-unpublished) remedies live in the module docs of
# scripts/xtask/src/lint_publish_registration.rs.

