# Cache EIP — cache a computed body and serve it on subsequent requests
# with the same key, invalidate a single entry, and serve a stale entry
# after its TTL expires.
#
# Demonstrates cache (lookup → on-miss → write-back), cache_invalidate
# (remove a single key), cache_peek_stale (serve a post-expiry entry),
# and stale-while-revalidate (peek with on_miss: continue, then branch
# on CamelCachePeekHit to fetch and cache on a miss).

routes:
  - id: "cache-demo"
    from: "timer:tick?period=2000&repeatCount=3"
    steps:
      - set_header:
          key: "cacheKey"
          value: "user-profile-42"
      # ANCHOR: cache-route
      - cache:
          key: "${header.cacheKey}"
          ttl: "5s"
          on_miss:
            - set_body: "computed-fresh-data"
            - log: "Cache MISS — body computed and stored"
      - log: "After cache body is: ${body}"
      # ANCHOR_END: cache-route

  - id: "cache-invalidate-demo"
    from: "timer:tick?period=6000&repeatCount=1"
    steps:
      - set_header:
          key: "cacheKey"
          value: "user-profile-42"
      # ANCHOR: cache-invalidate-route
      - cache_invalidate:
          key: "${header.cacheKey}"
      - log: "Cache entry invalidated for key: ${header.cacheKey}"
      # ANCHOR_END: cache-invalidate-route

  - id: "cache-peek-stale-demo"
    from: "timer:tick?period=8000&repeatCount=1"
    steps:
      - set_header:
          key: "cacheKey"
          value: "user-profile-42"
      # ANCHOR: cache-peek-stale-route
      - cache_peek_stale:
          key: "${header.cacheKey}"
      - log: "After peek_stale body is: ${body}"
      # ANCHOR_END: cache-peek-stale-route

  - id: "swr-cache-route"
    from: "timer:tick?period=10000&repeatCount=1"
    steps:
      - set_header:
          key: "cacheKey"
          value: "user-profile-42"
      # ANCHOR: swr-cache-route
      - cache_peek_stale:
          key: "${header.cacheKey}"
          on_miss: continue
      - choice:
          when:
            - simple: "${exchangeProperty.CamelCachePeekHit} == false"
              steps:
                - set_body: "fresh-data"
                - cache:
                    key: "${header.cacheKey}"
                    ttl: "5s"
                    on_miss:
                      - log: "SWR miss — fresh body stored"
          otherwise:
            - log: "Serving cached body: ${body}"
      # ANCHOR_END: swr-cache-route

  # ===========================================================================
  # Route 5: Circuit breaker fallback — serve stale data on upstream failure
  # ===========================================================================
  # Composes route-level circuit_breaker.fallback with cache_peek_stale for
  # stale-on-error resilience. The `cache` step wraps the upstream fetch: on a
  # miss it computes the body (standing in for the real upstream call) and
  # stores it under the static key `user-profile-42`. In a real deployment the
  # upstream call fails; after `failure_threshold` consecutive failures the
  # circuit opens. While open, the fallback peeks the SAME static key and
  # serves the last cached (possibly stale) entry instead of failing with
  # CircuitOpen. On a peek MISS (no entry), the default `on_miss: stop` policy
  # stops the fallback cleanly.
  #
  - id: "cb-fallback-stale-demo"
    from: "timer:tick?period=12000&repeatCount=1"
    # ANCHOR: cb-fallback-stale-route
    circuit_breaker:
      failure_threshold: 1
      open_duration_ms: 60000
      fallback:
        - cache_peek_stale:
            key: "user-profile-42"
    # ANCHOR_END: cb-fallback-stale-route
    steps:
      - cache:
          key: "user-profile-42"
          ttl: "5s"
          on_miss:
            - set_body: "computed-fresh-data"
            - log: "Cache MISS — body computed and stored"
      - log: "After cache body is: ${body}"
