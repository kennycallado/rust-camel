# Combine scripted HTTP partner assertions and seeded SQL state assertions
# in one scenario. The POST and GET requests do not populate the SQL table.
#
# The HTTP actions need [components.http] allow_internal in Camel.toml.
# The SQL actions need the appdb datasource in Camel.toml and the camel-cli
# `sql` Cargo feature for the `sql:` action.
#
# Run from the example directory:
#   cd examples/integration-testing
#   ../../target/debug/camel test partner-sql.test.yaml
# Expected result: 7 passed, 0 failed.
routeFiles: []
scenario:
  - sql:
      datasource: appdb
      prepare:
      - CREATE TABLE orders (id INTEGER, sku TEXT)
      - INSERT INTO orders VALUES (1, 'abc')
      - INSERT INTO orders VALUES (2, 'def')
  - send:
      to:
        endpoint: http://127.0.0.1:0/orders
        provisioning: harness
        bindVar: PARTNER
      method: POST
      body:
        sku: abc
  - receive:
      from:
        endpoint: http://127.0.0.1:0/orders
        provisioning: harness
        bindVar: PARTNER
      deadline: 5s
      extract:
        orderId: body.id
  - send:
      to: 'http://${PARTNER}/orders/${orderId}'
      method: GET
  - receive:
      from: 'http://${PARTNER}/orders/${orderId}'
      deadline: 5s
  - validate:
      target:
        lastReceived: 'http://${PARTNER}/orders/${orderId}'
      expectation:
        contains: ord-7
  - validate:
      target:
        sql:
          datasource: appdb
          query: SELECT id, sku FROM orders ORDER BY id
      expectation:
        columns: [id, sku]
        rows:
        - [1, 'abc']
        - [2, 'def']
partners:
  http://127.0.0.1:0/orders:
    - method: POST
      path: /orders
      response:
        status: 201
        headers:
          content-type: application/json
        body:
          id: ord-7
    - method: GET
      path: /orders/ord-7
      response:
        status: 200
        headers:
          content-type: application/json
        body:
          id: ord-7
