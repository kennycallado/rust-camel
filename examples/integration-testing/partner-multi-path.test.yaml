# Partner multi-path scenario (partner-multi-path.test.yaml): ONE
# declared harness endpoint serves TWO route dial paths. The route
# dials `/orders` then `/billing` on the one `${env:MOCK}` authority,
# and the `partners:` section scripts each path to a distinct body.
#
# The partner is declared ONCE through the object-form partner target
# of the validate: the harness folds `bindVar: MOCK` into both tiers
# (scenario variables carry `host:port`, the route env carries the
# full `http://host:port` form) before the action list runs. No second
# endpoint, no second bindVar, no second listener — that fan-out is the
# anti-pattern this pair replaces.
#
# TWO dynamic-reference receives each name their own path, and each
# drains its own arrival lane on the single listener:
#   - receive `from: http://${MOCK}/orders`  drains the /orders lane
#   - receive `from: http://${MOCK}/billing` drains the /billing lane
# A dynamic receive must name a path — a bare authority is an apparatus
# error. The registered key remains the adapter-lookup key; the path on
# the wire picks the lane. Each receive sees the wire REQUEST (the
# response went to the route).
#
# One exact-count partner validate remains to prove the recorder
# surface: it counts BOTH arrivals on the single listener independent
# of the two receives (the recorder keeps an arrival even after its
# lane is drained). The deadline polls until the count settles.
routeFiles: [partner-multi-path.routes.yaml]
scenario:
  - send:
      to: direct:start
      body: fanout-payload
  - receive:
      from: http://${MOCK}/orders
      deadline: 5s
      extract:
        ordersPath: path
        ordersBody: body
  - validate:
      target: {variable: ordersPath}
      expectation: /orders
  - validate:
      target: {variable: ordersBody}
      expectation: fanout-payload
  - receive:
      from: http://${MOCK}/billing
      deadline: 5s
      extract:
        billingPath: path
  - validate:
      target: {variable: billingPath}
      expectation: /billing
  - validate:
      target:
        partner:
          endpoint: http://127.0.0.1:0/orders
          provisioning: harness
          bindVar: MOCK
      expectation: {count: 2}
      deadline: 5s
partners:
  http://127.0.0.1:0/orders:
    - path: /orders
      response:
        status: 200
        body: orders-ok
    - path: /billing
      response:
        status: 200
        body: billing-ok
