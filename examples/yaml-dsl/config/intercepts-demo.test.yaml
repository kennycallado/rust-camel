# =============================================================================
# `camel test` document for the intercepts-demo route.
#
# References the route file above, delivers one `direct:` input, intercepts
# the `kafka:orders` send with `skipTo: mock:orders`, and asserts that
# `mock:orders` received the exchange. Without the intercept, route load
# would fail because `kafka` is not in the lean `camel test` component set.
# =============================================================================

routeFiles: [intercepts-demo.yaml]

inputs:
  - to: "direct:start"
    body: "hello"

intercepts:
  kafka:orders:
    skipTo: mock:orders

expects:
  mock:orders:
    count: 1
    bodies: ["hello"]
