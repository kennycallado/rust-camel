# =============================================================================
# Route for the `camel test` repositories-demo example.
#
# A single `direct:` route that reads a `cache:` step backed by the named
# repository `persistent`. On a cache miss the exchange diverts to
# `log:miss`; on a hit it skips straight to `log:out`. The paired
# `repositories-demo.test.yaml` document declares `persistent` as an
# in-memory stub and intercepts the `log:` sends into mock endpoints, so
# the test passes without a real cache backend. This production file
# contains routes only; the test doubles live in the test document.
# =============================================================================

routes:
  - id: "repositories-demo"
    from: "direct:orders"
    steps:
      - cache:
          repository: persistent
          key: k
          on_miss:
            - to: "log:miss"
      - to: "log:out"
