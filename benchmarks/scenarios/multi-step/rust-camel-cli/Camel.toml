# Benchmark fixture for rust-camel CLI + YAML (multi-step scenario,
# loadgen-connections-multistep-bench Task 2.1). Mirrors the
# http-server scenario's Camel.toml shape — same ADR-0033 fail-closed
# exec stub, same supervision block — but lives under the multi-step
# scenario dir so `camel run` picks up the multi-step route
# (routes/multi-step.yaml: http consumer on 8081, two rhai scripts +
# choice branch per exchange; see that file's header for the
# preflight contract).
#
# The marker `BENCH_ROUTE_READY <unix_ms>` is emitted by the wrapper
# script (`multi-step-cli-wrapper.sh`) by detecting the child's
# `CamelContext started` stdout line (rc-w1u9 post-bind signal) AND
# passing the preflight POST asserted in the route header. This
# Camel.toml does NOT contain the marker line; the marker is a
# wrapper-side concern.

[default]
routes = ["routes/*.yaml"]
log_level = "INFO"
watch = false

# ADR-0033 fail-closed workaround: ExecBundle requires at least one profile
# to pass startup validation, even when no route uses `exec:` URIs. The stub
# below registers `true` (a no-op that always exits 0) under the name
# `bench-stub` so validation succeeds. It is never invoked by the benchmark.
# NixOS note: bare `true` resolves via PATH at CLI startup; do NOT hardcode
# `/bin/true` (NixOS has no FHS, /bin/true does not exist).
[default.components.exec]
workspace_root = "."

# `profiles` is a Vec<ExecProfile> — TOML array-of-tables syntax ([[...]]),
# NOT a map ([default.components.exec.profiles.<name>] would deserialize
# as a struct/map and fail with "invalid type: map, expected a sequence").
[[default.components.exec.profiles]]
name = "bench-stub"
executable = "true"

[default.supervision]
max_attempts = 5
initial_delay_ms = 1000
backoff_multiplier = 2.0
max_delay_ms = 60000
