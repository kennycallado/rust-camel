# t2-json route for rust-camel-cli (Pair B, OpenSpec change
# bench-missing-cells task 2.1).
#
# TEMPLATE TOKENS — this file is NOT run directly. The smoke script and
# the harness invoke it via TEMPLATE COPY: copy to a temp file, then
# sed-substitute:
#   SIZE  -> ${BENCH_PAYLOAD_BYTES:-32768}   (canonical body size, bytes)
#   GOLDEN -> the (size, 0) SHA-256 digest from the scenario README's
#             golden table
# then run: camel run --config Camel.toml --routes <temp> --no-watch.
#
# Flow (mirrors the lib fixture): frozen-body latch (cache: the
# canonical document is built ONCE per process and reused per tick —
# see the latch comment at the first step) -> unmarshal json (body
# becomes Body::Json, the parsed structured value) -> filter
# (jsonpath) -> transform (js operates on the PARSED structured body,
# inserts "bench": true, returns the MAP — never a string;
# marshal("json") is the single serializer) -> marshal json -> output
# assert (script, rhai: exact SIZE+13 length AND substring
# "bench":true) -> header with the output length -> marker.
#
# Frozen-body latch (bench-consol-tick task 3.1, bd rc-sgmk): the
# yaml DSL has no lifecycle hook for startup-time construction, so the
# canonical document is built via the cache-EIP first-tick latch: the
# `cache` step looks up a CONSTANT key in the built-in "memory"
# repository; the MISS path (first completed tick, singleflight —
# `coalesce_misses: true` so on_miss runs exactly once per process)
# builds the document with the original rhai code, runs the input
# assert, logs BENCH_INPUT_SHA256 once, and stores the resulting
# Body::Text; every later tick is a HIT that reconstructs the stored
# document (Body::Text clone — the same per-exchange constant-set the
# lib fixture's `.set_body(body)` performs) and skips on_miss. The
# measured window therefore contains only exchange processing,
# mirroring the lib/JVM/node peers. The tick-1 build is a single sample
# per round — statistically invisible at nearest-rank p50/p95/p99
# (1 of n≥438) — but it is NOT harness-excluded: the parser sees every
# record from tick 1 on. Do not lean on this latch to hide heavier
# one-shot work.
# A second one-shot timer route for a true pre-marker build was
# rejected: timer routes have no guaranteed start ordering and
# bench_instrument route-bracket mode wraps EVERY timer-sourced route,
# so the extra route would emit a spurious latency record.
#
# Language notes (recorded per task 2.1):
# - rhai binds `body` as TEXT ONLY. Before unmarshal that is the
#   canonical document (assert domain); after marshal that is the output
#   bytes (assert domain). A rhai transform AFTER unmarshal is
#   impossible: Body::Json reads as "" in rhai — hence the js transform.
# - The js language (`camel.body`) exposes the structured body; the
#   expression mutates a structured copy and returns the MAP, and
#   set_body/transform lowers Value::Object to Body::Json — so
#   marshal("json") performs the only serialization.
# - The filter predicate is `$.id` (truthiness of the selected value),
#   NOT the literal comparison `$.id == 'bench'`: the DSL's jsonpath
#   predicate is truthiness-of-selection (RFC 9535 comparisons live
#   inside [?(...)] filters). The canonical builder authors
#   id == "bench" by construction, so `$.id` selects a non-empty string
#   iff the document is the canonical one.
#
# The marker `BENCH_ROUTE_READY bytes=${header.benchOutLen}` emits only
# when BOTH in-route asserts pass — a marker-suffix mismatch or a throw
# means the cell fails (per the T2 marker contract).

routes:
  - id: "bench-route"
    from: "timer:bench?period=10&repeatCount=10000&delay=0"
    steps:
      # Frozen-body latch (see the header note): MISS = first completed
      # tick builds the canonical document, asserts it, logs the input
      # digest once, and stores it; HIT = every later tick reuses the
      # stored Body::Text. The rhai construction, the input assert and
      # the BENCH_INPUT_SHA256 log run ONCE per process — OUTSIDE the
      # per-tick processing window (bench-consol-tick task 3.1).
      - cache:
          repository: memory
          key: "t2-json-canonical-body"
          coalesce_misses: true
          on_miss:
            # Canonical document, exactly SIZE bytes, tick 0 (selftest):
            # {"id":"bench","seq":0,"fill":"<K×'b'>"} — overhead 32 bytes.
            # rhai has no string-repeat operator; `pad` fills in one pass.
            - set_body:
                rhai: |
                  let fill = "";
                  fill.pad(SIZE - 32, 'b');
                  let doc = "{\"id\":\"bench\",\"seq\":0,\"fill\":\"" + fill + "\"}";
                  doc
            # Input assert (script step: errors propagate — a throw kills the
            # route before the marker, unlike expression-position throws which
            # are swallowed to a null body by the compiler's await_eval).
            - script:
                language: rhai
                source: |
                  if body.len() != SIZE {
                    throw "t2-json input length mismatch: got " + body.len();
                  }
                  if !body.contains("\"id\":\"bench\"") || !body.contains("\"seq\":0,") {
                    throw "t2-json input is not the canonical document";
                  }
                  let expected = "";
                  expected.pad(SIZE - 32, 'b');
                  let doc = "{\"id\":\"bench\",\"seq\":0,\"fill\":\"" + expected + "\"}";
                  if body != doc {
                    throw "t2-json input not byte-identical to canonical doc";
                  }
            - log: "BENCH_INPUT_SHA256=GOLDEN"
      # Body::Text -> Body::Json (parsed structured value).
      - unmarshal: json
      - filter:
          jsonpath: "$.id"
          steps:
            # Structured transform: insert the member, return the MAP.
            - transform:
                language: js
                source: "camel.body.bench = true; camel.body"
      # Single serialization: Value::Object -> text (serde_json).
      - marshal: json
      # Output assert: exact SIZE+13 length AND the inserted member.
      - script:
          language: rhai
          source: |
            if body.len() != SIZE + 13 {
              throw "t2-json output length mismatch: got " + body.len();
            }
            if !body.contains("\"bench\":true") {
              throw "t2-json output missing bench member";
            }
      - set_header:
          key: "benchOutLen"
          rhai: "body.len()"
      # Marker gate (tick mode, bench-consol-tick task 2.3): the marker
      # sits at its original code-path position but must fire exactly
      # ONCE per process (the harness m1 assert counts markers with
      # grep -cF and requires exactly 1). Under the repeating timer the
      # route completes once per tick, so the DSL-native gate is an
      # idempotent_consumer over the built-in "memory" repository with
      # a CONSTANT Simple key: the first completed exchange reserves
      # the key and emits the marker; every later tick is a duplicate
      # and skips the child log silently. DSL analogue of the lib
      # fixture's AtomicBool gate (task 2.2).
      - idempotent_consumer:
          repository: memory
          expression: "bench-marker-once"
          steps:
            - log: "BENCH_ROUTE_READY bytes=${header.benchOutLen}"
