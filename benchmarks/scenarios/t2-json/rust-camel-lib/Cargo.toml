[package]
name = "t2-json-rust-camel-lib"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Canonical payload builders + golden digests (OpenSpec change
# bench-missing-cells, task 1.2). Path dep into the same worktree.
bench-loadgen = { path = "../../../../benchmarks/harness/loadgen" }
# Path deps resolve to the worktree's own checkout of rust-camel crates
# (4 levels up: t2-json/rust-camel-lib/ -> scenarios/ -> benchmarks/ ->
# worktree root). Same pattern as the t2-realistic-eip lib fixture.
camel-api = { path = "../../../../crates/camel-api" }
camel-builder = { path = "../../../../crates/camel-builder" }
camel-core = { path = "../../../../crates/camel-core" }
camel-processor = { path = "../../../../crates/camel-processor" }
camel-component-timer = { path = "../../../../crates/components/camel-timer" }
# Output assert: parse the marshaled text for the semantic check.
serde_json = "1"
# Digest-check helper (corruption unit test).
sha2 = "0.11"
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# Workspace member of the parent rust-camel workspace (auto-discovered
# by cargo from the root Cargo.toml — same mechanism as the
# t2-realistic-eip lib fixture). Sharing the workspace Cargo.lock
# guarantees that transitive dep versions match what the CLI artifact
# (Pair B) sees, so Pair A vs Pair B isolates only parser/CLI overhead,
# not dep drift.

[[bin]]
name = "t2-json"
path = "src/main.rs"
