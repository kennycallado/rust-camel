# t2-json scenario route for camel-quarkus-yaml (JVM, Pair B, OpenSpec
# change bench-missing-cells task 2.2; tick mode bench-consol-tick 2.5).
#
# Same logical route as the camel-quarkus-dsl BenchRoute (Pair A) but
# authored in Apache Camel YAML DSL: timer -> process(benchBody) ->
# process(markStart) -> unmarshal(json) -> filter(jsonpath) ->
# process(insertBench) -> marshal(json) -> process(assertOutput) ->
# process(emitMarker) -> process(writeLatency). Discovered via the
# default classpath:camel/* scan (native mode uses the pinned
# camel.main.routesIncludePattern from the -native sibling's
# application.properties — Substrate VM cannot enumerate `camel/*`).
#
# The `process` steps resolve CDI-produced named beans from
# BenchBeans.java (benchBody / markStart / insertBench / assertOutput /
# emitMarker / writeLatency); the route STRUCTURE lives in this file,
# which is the property Pair B measures. The marker `BENCH_ROUTE_READY
# bytes=<n>` is the exact harness grep target; any processor assert
# failure kills the route BEFORE the marker so the cell fails loudly.
#
# Tick mode (bench-consol-tick 2.5): repeating warm timer
# (period=10&repeatCount=10000&delay=0, same URI form as the dsl module and the
# standalone fixtures); the emitMarker bean is latched to the FIRST
# completed exchange — exactly one marker line per process lifetime;
# the writeLatency bean appends one `BENCH_LATENCY <id> <duration_ns>`
# record per tick.
#
# Uses camelCase keys per Spike 1B finding that kebab-case is
# deprecated in Quarkus 3.20.0 YAML DSL (still parses but warns).

- route:
    from:
      uri: "timer:bench"
      parameters:
        period: 10
        repeatCount: 10000
        delay: 0
      steps:
        - process:
            ref: "benchBody"
        - process:
            ref: "markStart"
        - unmarshal:
            json:
              library: "Jackson"
              unmarshalType: "com.fasterxml.jackson.databind.node.ObjectNode"
        - filter:
            jsonpath: "$[?(@.id == 'bench')]"
            steps:
              - process:
                  ref: "insertBench"
        - marshal:
            json:
              library: "Jackson"
        - process:
            ref: "assertOutput"
        - process:
            ref: "emitMarker"
        - process:
            ref: "writeLatency"
