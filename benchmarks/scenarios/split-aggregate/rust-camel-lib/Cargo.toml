[package]
name = "split-aggregate-rust-camel-lib"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Harness parity dep (OpenSpec change bench-missing-cells): the M2 load
# generator lives in the same workspace and later tasks wire this
# scenario into the harness. Path dep into the same worktree, same
# pattern as the t2-json lib fixture.
bench-loadgen = { path = "../../../../benchmarks/harness/loadgen" }
# Path deps resolve to the worktree's own checkout of rust-camel crates
# (4 levels up: split-aggregate/rust-camel-lib/ -> scenarios/ ->
# benchmarks/ -> worktree root). Same pattern as the t2-json lib fixture.
camel-api = { path = "../../../../crates/camel-api" }
camel-builder = { path = "../../../../crates/camel-builder" }
camel-core = { path = "../../../../crates/camel-core" }
# The aggregator completion-payload binding (doc comment on
# `completion_assert`) names camel_processor::aggregator consts.
camel-processor = { path = "../../../../crates/camel-processor" }
camel-component-timer = { path = "../../../../crates/components/camel-timer" }
camel-component-direct = { path = "../../../../crates/components/camel-direct" }
# Canonical array digest (input provenance + golden test).
sha2 = "0.11"
hex = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# Test-only: drive 99 fragments through the real `direct:agg-in` route
# for the incomplete-bucket test (no timer route involved).
[dev-dependencies]
camel-component-api = { path = "../../../../crates/components/camel-component-api" }
tower.workspace = true

# Workspace member of the parent rust-camel workspace (auto-discovered
# by cargo from the root Cargo.toml — same mechanism as the t2-json lib
# fixture). Sharing the workspace Cargo.lock guarantees that transitive
# dep versions match what the CLI artifact (Pair B) sees, so Pair A vs
# Pair B isolates only parser/CLI overhead, not dep drift.

[[bin]]
name = "split-aggregate"
path = "src/main.rs"
