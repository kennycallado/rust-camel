# split-aggregate route for rust-camel-cli (Pair B, OpenSpec change
# bench-missing-cells task 2.3). YAML mirror of the rust-camel-lib
# fixture: the canonical 100-item array is split SEQUENTIALLY into
# fragments, each dispatched to direct:agg-in, aggregated under a
# constant correlation key with completion at exactly 100.
#
# NO template tokens — the canonical array is fixed (100 items,
# "b0".."b99", 591 bytes). Run directly:
#   camel run --config Camel.toml --routes routes/split-aggregate.yaml
#
# Flow (mirrors the lib fixture):
#   route bench-split-route:
#     timer -> set_body (FROZEN constant: the canonical array is a yaml
#        literal — built once at route load, the same mechanism the xsd
#        cli route uses for its payload; bench-consol-tick task 3.1)
#     -> input assert (script, rhai: exact 591 length — errors
#        propagate, no marker on failure)
#     -> BENCH_INPUT_SHA256 log, gated ONCE per process by a
#        constant-key idempotent_consumer (same DSL-native once-gate
#        as the marker — task 3.1 hoists the digest log out of the
#        per-tick window)
#     -> BENCH_WINDOW_START sentinel (route-mode window OPEN — the
#        body supply + input validation above are OUTSIDE the window,
#        e_opus ruling D3)
#     -> unmarshal json (body becomes the parsed Body::Json array)
#     -> split (expression json_array, sequential — NO parallel)
#        -> to direct:agg-in (per fragment)
#     -> BENCH_WINDOW_END sentinel (window CLOSE — the LAST step of
#        the timer route; the agg route's work ran INSIDE the window
#        via the synchronous direct dispatch)
#   route bench-agg-route (direct: consumer — passes through route
#   mode UNINSTRUMENTED; its work is inside the main record's window):
#     direct:agg-in -> set_header (constant correlation key)
#     -> aggregate (header correlation, strategy collect_all,
#        completion_size 100, force_completion_on_stop false)
#     -> filter (rhai: CamelAggregatedSize == 100) — gates the
#        completion steps. The aggregate step has no timeout and no
#        force-completion, so it compiles as a plain mid-route step and
#        the PENDING sentinel (property CamelAggregatorPending=true,
#        empty body) of an incomplete bucket flows through the SAME
#        subsequent steps — the filter is what keeps the completion
#        steps completion-only.
#     -> assert (script, js: the aggregator-reported CamelAggregatedSize
#        must equal 100 AND the actual collected Body::Json array
#        length — the Java/lib consistency check, F2 upgrade) -> the
#        actual length is stamped as bench.aggregated.size
#     -> marker log (simple: reads the completion property)
#
# Language notes (recorded per task 2.3):
# - rhai binds `body` as TEXT ONLY — perfect for the canonical-array
#   build/assert (before unmarshal), useless for the aggregated
#   Body::Json array after the aggregate. The completion assert uses js
#   (`camel.body` exposes the structured body).
# - The aggregator stamps `CamelAggregatedSize` (= bucket length, JSON
#   number) on the completion exchange
#   (crates/camel-processor/src/aggregator.rs, `call`). The marker
#   interpolates THAT property; a pending sentinel has no such property
#   and is filtered out before the marker step.
# - set_header `value:` is the literal form; the correlation key is a
#   CONSTANT. `header` is the required field and drives builder-path
#   correlation (compile.rs compile_aggregate_step -> correlate_by(
#   def.header)); `correlation_key` is the optional canonical-path
#   spelling — both carry the same constant for parity.

routes:
  - id: "bench-split-route"
    from: "timer:bench?period=10&repeatCount=10000&delay=0"
    steps:
      # Canonical array, FROZEN at route load (bench-consol-tick task
      # 3.1): 100 items, item i = "b<i>", compact JSON — exactly 591
      # bytes (README golden table). A yaml literal value is the
      # startup-constant mechanism the xsd cli route already uses for
      # its payload; the per-tick window holds no body construction.
      # sha256 = 123444b4…59316 (assert below guards the length).
      - set_body:
          value: '["b0","b1","b2","b3","b4","b5","b6","b7","b8","b9","b10","b11","b12","b13","b14","b15","b16","b17","b18","b19","b20","b21","b22","b23","b24","b25","b26","b27","b28","b29","b30","b31","b32","b33","b34","b35","b36","b37","b38","b39","b40","b41","b42","b43","b44","b45","b46","b47","b48","b49","b50","b51","b52","b53","b54","b55","b56","b57","b58","b59","b60","b61","b62","b63","b64","b65","b66","b67","b68","b69","b70","b71","b72","b73","b74","b75","b76","b77","b78","b79","b80","b81","b82","b83","b84","b85","b86","b87","b88","b89","b90","b91","b92","b93","b94","b95","b96","b97","b98","b99"]'
      # Input assert: errors propagate — a wrong canonical array kills
      # the route before any marker.
      - script:
          language: rhai
          source: |
            if body.len() != 591 {
              throw "split-aggregate canonical array length mismatch: got " + body.len();
            }
      # Input provenance, ONCE per process (bench-consol-tick task 3.1):
      # the digest log sits at its original code-path position but is
      # gated by a constant-key idempotent_consumer — the first tick
      # reserves the key and logs; every later tick is a duplicate and
      # skips silently. Same DSL-native once-gate as the marker below.
      - idempotent_consumer:
          repository: memory
          expression: "bench-sha-once"
          steps:
            - log: "BENCH_INPUT_SHA256=123444b475c48473309ed966eb69896c6725429021a5a5d2e0eaa0a77a159316"
      # Route-mode window OPEN (e_opus ruling D3): the body supply and
      # the input validation above are OUTSIDE the measured window; in
      # route mode the bench_instrument module REPLACES this Log step
      # with the start-stamp processor — the sentinel never prints in
      # a measured run.
      - log: "BENCH_WINDOW_START"
      # Body::Text -> Body::Json (the parsed 100-item array).
      - unmarshal: json
      # Sequential split (parallel defaults to false): each fragment
      # ("b0".."b99") is dispatched to the agg route before the next.
      - split:
          expression: json_array
          steps:
            - to: "direct:agg-in"
      # Route-mode window CLOSE — the LAST step of the timer route:
      # replaced by the end-write processor (duration = close −
      # start). The agg route's assert + marker ran INSIDE the window
      # via the synchronous direct dispatch above (uniform across
      # cells). NOTHING may follow this sentinel in the timer route.
      - log: "BENCH_WINDOW_END"

  - id: "bench-agg-route"
    from: "direct:agg-in"
    steps:
      - set_header:
          key: "bench.correlation"
          value: "bench"
      - aggregate:
          header: "bench.correlation"
          correlation_key: "bench.correlation"
          strategy: collect_all
          completion_size: 100
          force_completion_on_stop: false
      # Completion gate: the aggregator stamps CamelAggregatedSize on
      # the completion exchange only; pending sentinels are dropped
      # here so the steps below are completion-only.
      - filter:
          rhai: 'property("CamelAggregatedSize") == 100'
          steps:
            # Completion assert (F2 upgrade — the Java/lib consistency
            # check): the aggregator-reported CamelAggregatedSize must
            # equal 100 AND equal the ACTUAL collected list length
            # (mirror of Java App.java assertCompletion and lib
            # split.rs completion_assert; rhai cannot read the
            # structured body, hence js — `camel.body` exposes the
            # CollectAll JSON array, `camel.property` the reported
            # size). On success the ACTUAL length is stamped as
            # bench.aggregated.size for the marker — no hardcoded
            # value. Ends with `camel.body` (script-step idiom) so the
            # body passes through unchanged.
            - script:
                language: js
                source: |
                  const reported = camel.property("CamelAggregatedSize");
                  const actual = camel.body.length;
                  if (reported !== 100) {
                    throw "split-aggregate CamelAggregatedSize " + reported + " != expected 100";
                  }
                  if (actual !== 100) {
                    throw "split-aggregate aggregated collection length " + actual + " != expected 100";
                  }
                  if (reported !== actual) {
                    throw "split-aggregate CamelAggregatedSize " + reported + " != collection length " + actual;
                  }
                  camel.set_property("bench.aggregated.size", actual);
                  camel.body
            # Marker gate (tick mode, bench-consol-tick task 2.3): same
            # mechanism as the t2-json gate — constant-key
            # idempotent_consumer over the built-in "memory" repository
            # admits the FIRST completed bucket only; every later
            # tick's completion is a duplicate and skips the marker
            # log. Keeps the harness m1 exactly-1 marker contract while
            # the timer repeats (lib fixture: AtomicBool gate).
            - idempotent_consumer:
                repository: memory
                expression: "bench-marker-once"
                steps:
                  - log: "BENCH_ROUTE_READY items=${exchangeProperty.bench.aggregated.size}"
