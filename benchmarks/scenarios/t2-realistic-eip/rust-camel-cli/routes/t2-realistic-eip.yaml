# T2 scenario route for rust-camel-cli (Pair B, bd rc-p9ki Task 3).
#
# Mirrors the v1 `routes/startup-minimal.yaml` structure (`routes:` array
# of route objects with `from` / `steps` keys) but exercises the full T2
# EIP shape from spec §4.1: timer -> set_body -> BENCH_WINDOW_START
# (route-mode window OPEN — body supply EXCLUDED, e_opus ruling D3) ->
# set_header -> filter -> choice.when/otherwise -> BENCH_WINDOW_END
# (window CLOSE) -> log. Same logical route as the Apache Camel
# YAML subproject's `camel/routes.yaml`; only the field names differ
# (rust-camel uses `key:` / `value:` for set_header and `value:` for
# set_body literal, NOT Apache Camel's `name:` / `constant:` — see
# spike `benchmarks/attic/spikes/spike-yaml-predicate/routes/spike-t2.yaml`
# for the proven rust-camel shape).
#
# The two BENCH_WINDOW sentinel `log` steps are REPLACED by the
# bench_instrument route-mode timing processors in a measured run
# (start-stamp / end-write, one BENCH_LATENCY record per tick); they
# never print as literal lines. The marker gate below sits AFTER the
# END sentinel — the trailing log is OUTSIDE the measured window.
#
# The `log` step uses the bare-string form which is always evaluated as
# Simple language (yaml.rs L588-593: LogMessageData::Literal wraps the
# value as a Simple expression). The log EIP therefore evaluates
# `${body}` and emits `BENCH_ROUTE_READY body=pong-bench` on stdout —
# the exact grep target the harness watches for.
#
# Behavioral equivalence with the Apache Camel YAML fixture (same filter
# / choice semantics, same Simple predicate strings) — this is what
# makes T2 Pair B language-subsystem-equivalent to Apache Camel Pair B.
# (Pair A is NOT language-subsystem-equivalent: rust-camel-lib uses
# closure predicates — see that fixture's source comment.)

routes:
  - id: "bench-route"
    from: "timer:bench?period=10&repeatCount=10000&delay=0"
    steps:
      - set_body:
          value: "ping"
      # Route-mode window OPEN (e_opus ruling D3): body supply above is
      # OUTSIDE the measured window; replaced by the start-stamp
      # processor in route mode.
      - log: "BENCH_WINDOW_START"
      - set_header:
          key: "source"
          value: "bench"
      - filter:
          simple: "${body} == 'ping'"
          steps:
            - choice:
                when:
                  - simple: "${header.source} == 'bench'"
                    steps:
                      - set_body:
                          value: "pong-bench"
                otherwise:
                  - set_body:
                      value: "pong-other"
      # Route-mode window CLOSE: replaced by the end-write processor
      # (duration = close − start). The marker gate below is the
      # trailing log — OUTSIDE the measured window.
      - log: "BENCH_WINDOW_END"
      # Marker gate (tick mode, bench-consol-tick task 2.3): the
      # repeating timer completes this route once per tick, so the
      # marker log is gated by a constant-key idempotent_consumer over
      # the built-in "memory" repository — the first completed tick
      # emits `BENCH_ROUTE_READY body=pong-bench` exactly once; later
      # ticks are duplicates and skip the child log (harness m1
      # requires exactly 1 marker; lib fixture: AtomicBool gate).
      - idempotent_consumer:
          repository: memory
          expression: "bench-marker-once"
          steps:
            - log: "BENCH_ROUTE_READY body=${body}"
