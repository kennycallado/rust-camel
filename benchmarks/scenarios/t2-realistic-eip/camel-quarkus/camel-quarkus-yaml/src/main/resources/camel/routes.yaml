# T2 scenario route for camel-quarkus-yaml (JVM, Pair B).
# Same logical route as the camel-quarkus-dsl BenchRoute (Pair A) but
# authored in Apache Camel YAML DSL: timer -> setBody ->
# process(markStart) -> setHeader -> filter(simple) ->
# choice.when(simple)/otherwise -> process(writeLatency) ->
# process(emitMarker). markStart sits AFTER setBody and writeLatency
# BEFORE emitMarker — the e_opus ruling D3 anchor set (body supply
# EXCLUDED from the window, trailing log EXCLUDED). The marker
# `BENCH_ROUTE_READY body=pong-bench` is the exact grep target.
#
# Tick mode (OpenSpec change bench-consol-tick task 2.5, mirroring the
# standalone fixtures' task 2.4): repeating warm timer
# (period=10&repeatCount=10000&delay=0, same URI form as the dsl module). The
# markStart/emitMarker/writeLatency steps resolve CDI-produced named
# beans from LatencyBean.java; the route STRUCTURE stays in this
# parsed file, which is the property Pair B measures. The emitMarker
# bean is latched to the FIRST completed exchange — exactly one marker
# line per process lifetime; the writeLatency bean appends one
# `BENCH_LATENCY <id> <duration_ns>` record per tick.
#
# Uses `setBody` / `setHeader` (camelCase) per Spike 1B finding that
# `set-body` / `set-header` (kebab-case) is deprecated in Quarkus
# 3.20.0 (still parses but emits a deprecation warning).
- route:
    from:
      uri: "timer:bench"
      parameters:
        period: 10
        repeatCount: 10000
        delay: 0
      steps:
        - setBody:
            constant: "ping"
        - process:
            ref: "markStart"
        - setHeader:
            name: "source"
            constant: "bench"
        - filter:
            simple: "${body} == 'ping'"
            steps:
              - choice:
                  when:
                    - simple: "${header.source} == 'bench'"
                      steps:
                        - setBody:
                            constant: "pong-bench"
                  otherwise:
                    steps:
                      - setBody:
                            constant: "pong-other"
        - process:
            ref: "writeLatency"
        - process:
            ref: "emitMarker"
