[advisories]
# RUSTSEC-2023-0071 (rsa, Marvin Attack) — non-applicable in rust-camel.
# Since sqlx 0.9, MySQL caching_sha2_password RSA auth is behind the opt-in
# `mysql-rsa` feature; rust-camel does not enable it, so sqlx-mysql no longer
# pulls `rsa`. The crate remains in the lock only via surrealdb-core 3.2.4 ->
# jsonwebtoken 10.4.0's `rust_crypto` feature (wasm target). There it verifies
# RS256 tokens with public material against an operator-configured, trusted
# SurrealDB instance; rust-camel holds no RSA private key, so the Marvin
# private-key timing vector does not apply. The auth-issuance path (camel-auth)
# was migrated off `rsa` to pkcs1/pkcs8 (bd rc-ayu). Remove this entry once
# surrealdb's jsonwebtoken moves to 11 (or drops the rust_crypto feature).
#
# RUSTSEC-2026-0249 (smartstring, unmaintained) — transitive, non-applicable in
# rust-camel. `smartstring 1.0.1` is a MANDATORY (non-optional) dependency of
# `rhai 1.25.1` (the latest 1.x), pulled via camel-language-rhai. Unmaintained is
# informational, not a vulnerability; no feature combination avoids it. Remove this
# entry once a rhai release drops smartstring.
# RUSTSEC-2026-0387 (crypto-bigint 0.5.5, timing variability) — transitive,
# non-applicable in rust-camel. Chain: surrealdb-core 3.2.4 -> jsonwebtoken 10.4.0
# -> p384 -> primeorder -> elliptic-curve -> crypto-bigint 0.5.5. The advisory is
# about variable-time scalar arithmetic leaking secret key material during P-384
# ECDSA operations. rust-camel's own JWT path uses jsonwebtoken 11 with
# aws_lc_rs and only RS256 (camel-auth), so it never reaches this crate. The
# surrealdb copy exists because the component's SurrealDB client links
# jsonwebtoken for token verification against an operator-configured, trusted
# instance: rust-camel handles no P-384 private key, and verification uses
# public material. The fix requires crypto-bigint >= 0.7.6, which the
# elliptic-curve 0.13 line cannot take; cargo update cannot cross it.
# Upgrade path was measured (2026-10-24): surrealdb 3.3.4 STILL pulls
# crypto-bigint 0.5.5 and additionally pulls quick-xml 0.39.4
# (RUSTSEC-2026-0194/0195), so bumping trades one advisory for three.
# Remove this entry once surrealdb's jsonwebtoken/p384 chain reaches
# crypto-bigint >= 0.7.6 (tracked in bd rc-83l5f / rc-h7huz).
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0249", "RUSTSEC-2026-0387"]
informational_warnings = ["unmaintained"]
