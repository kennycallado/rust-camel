[advisories]
# RUSTSEC-2023-0071 (rsa, Marvin Attack) — non-applicable in rust-camel.
# `rsa` is pulled only by sqlx-mysql (camel-component-sql's sqlx `mysql` feature),
# used for client-side RSA public-key encryption in MySQL caching_sha2_password auth.
# Marvin is a private-key timing leak; the rust-camel side is the MySQL client and
# holds no RSA private key, so the vector does not apply. The auth-issuance path
# (camel-auth) was migrated off `rsa` to pkcs1/pkcs8 (bd rc-ayu). To fully drop rsa,
# remove MySQL support from camel-component-sql.
#
# RUSTSEC-2026-0235 (rkyv, OOB read on archives containing Rc/Arc) — transitive,
# non-applicable in rust-camel. `rkyv 0.7.46` is pulled by `rust_decimal` (optional
# dep behind its `rkyv` feature), which is in turn pulled by `surrealdb` (and its
# revision/collections/strand crates), used only by `camel-component-surrealdb`.
# The vector fires when deserializing an untrusted rkyv archive containing Rc/Arc.
# In rust-camel the rkyv bytes come from the operator-configured SurrealDB instance
# (trusted server), not from external route input. A malicious archive would require a
# compromised SurrealDB server, at which point the SurrealDB component is already
# untrusted at the transport layer. `cargo update -p rkyv` cannot cross the 0.7→0.8
# SemVer-incompatible boundary; the fix is upstream (surrealdb/rust_decimal must bump
# to rkyv 0.8). Remove this entry once a surrealdb release carries rkyv >=0.8.17.
#
# RUSTSEC-2026-0249 (smartstring, unmaintained) — transitive, non-applicable in
# rust-camel. `smartstring 1.0.1` is a MANDATORY (non-optional) dependency of
# `rhai 1.25.1` (the latest 1.x), pulled via camel-language-rhai. Unmaintained is
# informational, not a vulnerability; no feature combination avoids it. Remove this
# entry once a rhai release drops smartstring.
#
# RUSTSEC-2026-0373 (ammonia, case-sensitive CSS url() matching) — transitive,
# non-applicable in rust-camel. `ammonia 4.1.7` is pulled by `surrealdb-core`
# (surrealdb 3.2.4), used only by `camel-component-surrealdb`. The vector fires
# when sanitizing untrusted HTML that carries CSS: a quoted `url("")` is matched
# case-sensitively, so relative-URL/scheme limits can be bypassed. rust-camel does
# not sanitize untrusted HTML-with-CSS from route input; the SurrealDB instance is
# operator-configured and trusted (same reasoning as RUSTSEC-2026-0235 above).
# No patched ammonia version exists yet; the fix is upstream. Remove this entry
# once an ammonia release carries the fix (bd rc-9mq7v).
# RUSTSEC-2026-0387 (crypto-bigint 0.5.5, timing variability) — transitive,
# non-applicable in rust-camel. Chain: surrealdb-core 3.2.4 -> jsonwebtoken 10.4.0
# -> p384 -> primeorder -> elliptic-curve -> crypto-bigint 0.5.5. The advisory is
# about variable-time scalar arithmetic leaking secret key material during P-384
# ECDSA operations. rust-camel's own JWT path uses jsonwebtoken 11 with
# aws_lc_rs and only RS256 (camel-auth), so it never reaches this crate. The
# surrealdb copy exists because the component's SurrealDB client links
# jsonwebtoken for token verification against an operator-configured, trusted
# instance: rust-camel handles no P-384 private key, and verification uses
# public material. The fix requires crypto-bigint >= 0.7.6, which the
# elliptic-curve 0.13 line cannot take; cargo update cannot cross it.
# Upgrade path was measured (2026-10-24): surrealdb 3.3.4 STILL pulls
# crypto-bigint 0.5.5 and additionally pulls quick-xml 0.39.4
# (RUSTSEC-2026-0194/0195), so bumping trades one advisory for three.
# Remove this entry once surrealdb's jsonwebtoken/p384 chain reaches
# crypto-bigint >= 0.7.6 (tracked in bd rc-83l5f / rc-h7huz).
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0235", "RUSTSEC-2026-0249", "RUSTSEC-2026-0373", "RUSTSEC-2026-0387"]
informational_warnings = ["unmaintained"]
