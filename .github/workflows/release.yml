name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  ci-preflight:
    name: Preflight — CI evidence for tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require build and unit-test evidence for this commit
        # rc-1x9fl: a tag once published with zero test evidence, so this
        # job fails closed before the matrix or publish start.
        # Owner ruling 2026-11-11 (rc-86u4n, rc-99d5): the gate no longer
        # requires a single fully green run. A wall-clock ratio test on a
        # loaded runner must not block a release, so the binding evidence
        # is the Unit Tests job (Build + unit tests) and Full Tests is
        # advisory. Evidence is unioned across attempts of every completed
        # push-on-main run, so a flaky attempt that passes on re-run
        # counts. PR runs never qualify (synthetic merge commit).
        # No run, no green unit evidence, or an API error fails the release
        # before the matrix or publish start (call-release-matrix needs
        # this job). Token: built-in GITHUB_TOKEN with `actions: read`
        # (job-level permissions replace the workflow-level set — same
        # pattern as the publish job below); no secret setup.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse 'HEAD^{commit}')"
          runs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&per_page=100")"
          run_rows="$(printf '%s' "$runs_json" | jq -r '
            .workflow_runs[]
            | select(.event == "push" and .head_branch == "main" and .status == "completed")
            | "\(.id) \(.run_attempt // 1)"')"
          if [ -z "$run_rows" ]; then
            echo "::error::No completed push-on-main CI run for commit ${sha} — no build/unit-test evidence. Refusing to release."
            exit 1
          fi
          tested=""
          while read -r run_id attempts; do
            [ -n "$run_id" ] || continue
            n=1
            while [ "$n" -le "$attempts" ]; do
              jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/attempts/${n}/jobs?per_page=100")"
              # Tested iff the Unit Tests job is green AND each required
              # step exists exactly once (a rename fails closed, and a
              # duplicate step cannot stand in for the missing one) AND
              # both concluded success (a "skipped" step fails this).
              unit_ok="$(printf '%s' "$jobs_json" | jq -r '
                [.jobs[]
                  | select(.name == "Unit Tests (ubuntu-latest)")
                  | select(.conclusion == "success")
                  | select((([.steps[] | select(.name == "Build")] | length) == 1)
                      and (([.steps[] | select(.name == "Test (unit only — no Docker required)")] | length) == 1))
                  | select(([.steps[]
                    | select(.name == "Build" or .name == "Test (unit only — no Docker required)")
                    | .conclusion == "success"] | all))]
                | length > 0')"
              if [ "$unit_ok" = "true" ]; then
                full="$(printf '%s' "$jobs_json" | jq -r '
                  ([.jobs[] | select(.name == "Full Tests (ubuntu-latest)") | .conclusion] | first) // "absent"')"
                echo "Tested: commit ${sha} verified by CI run ${run_id} attempt ${n} (Unit Tests green: Build + unit tests)."
                if [ "$full" != "success" ]; then
                  echo "::warning::Full Tests (ubuntu-latest) is ${full} on run ${run_id} attempt ${n} — advisory only (rc-86u4n, rc-99d5); not release-blocking."
                fi
                tested=1
                break
              fi
              n=$((n + 1))
            done
            if [ -n "$tested" ]; then
              break
            fi
          done <<< "$run_rows"
          if [ -z "$tested" ]; then
            echo "::error::CI ran for ${sha} but no push-on-main attempt has Unit Tests (ubuntu-latest) green with Build and 'Test (unit only — no Docker required)' both success. Refusing to release."
            exit 1
          fi

  call-release-matrix:
    needs: [ci-preflight]
    uses: ./.github/workflows/release-matrix.yml
    with:
      publish: true
    secrets: inherit

  publish:
    name: Publish crates to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: call-release-matrix
    # Prerelease smoke tags (v*-rc.*) exercise matrix/assets/docker but must
    # not publish crates; skip cleanly rather than fail.
    if: ${{ !contains(github.ref_name, '-rc.') }}
    # Job-level permissions REPLACE the workflow-level set, so contents: read
    # must be restated for checkout. id-token: write enables the OIDC token
    # exchange with crates.io (trusted publishing).
    permissions:
      contents: read
      id-token: write
    # Trust relationship is scoped to this dedicated environment. Every crate
    # must be registered on crates.io as a trusted publisher with exactly:
    # owner kennycallado, repository rust-camel, workflow release.yml,
    # environment crates-io. Registration must be COMPLETE before the
    # CARGO_REGISTRY_TOKEN repository secret is deleted — a partially
    # registered set half-publishes a version (unrecoverable).
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - name: Ensure publish script is executable
        run: chmod +x ./scripts/publish-crates.sh
      # Trusted publishing: cargo credential provider. Each per-crate
      # `cargo publish` process invokes the provider, which mints a fresh
      # short-lived crates.io token seconds before use — the backend's
      # hardcoded 30-minute token expiry can never straddle a publish.
      # Registry wire format mirrors rust-lang/crates-io-auth-action v1.0.5.
      # Config key is `credential-provider` (the `credential-process` key
      # was removed from modern cargo).
      - name: Install cargo credential provider (TrustPub OIDC)
        run: |
          chmod +x ./scripts/trustpub-credential-helper.sh
          helper="$PWD/scripts/trustpub-credential-helper.sh"
          cfg="${CARGO_HOME:-$HOME/.cargo}/config.toml"
          mkdir -p "$(dirname "$cfg")"
          # Append-only on a fresh runner; the guard keeps re-runs idempotent
          # (a duplicate [registry] table would break every later cargo call).
          # A pre-existing [registry] table WITHOUT our key would collide on
          # append — fail loudly instead of corrupting the config.
          if grep -q '^credential-provider' "$cfg" 2>/dev/null; then
            :
          elif grep -q '^\[registry\]' "$cfg" 2>/dev/null; then
            echo "::error::$cfg already has a [registry] table without credential-provider — refusing to append a duplicate table"
            exit 1
          else
            {
              printf '[registry]\n'
              printf 'credential-provider = "%s"\n' "$helper"
            } >> "$cfg"
          fi
      - name: Publish workspace crates
        run: ./scripts/publish-crates.sh
