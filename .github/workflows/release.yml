name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use-cross: false
            bin-suffix: ""
            kafka-features: "cmake-build"
            install-librdkafka: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use-cross: true
            bin-suffix: ""
            kafka-features: "cmake-build"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use-cross: false
            bin-suffix: ""
            install-musl-tools: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use-cross: true
            bin-suffix: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            use-cross: false
            bin-suffix: ""
            kafka-features: "cmake-build"
          - os: macos-latest
            target: aarch64-apple-darwin
            use-cross: false
            bin-suffix: ""
            kafka-features: "cmake-build"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use-cross: false
            bin-suffix: ".exe"
            kafka-features: "cmake-build"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install cmake (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y

      - name: Install build deps (Linux native)
        if: matrix.install-librdkafka == true
        run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev libssl-dev libsasl2-dev

      - name: Install musl-tools
        if: matrix.install-musl-tools == true
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install target
        if: matrix.use-cross == false
        run: rustup target add ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross == true
        run: cargo install cross --version 0.2.5 --locked

      - name: Build binary
        run: |
          if [[ "${{ matrix.use-cross }}" == "true" ]]; then
            cross build -p camel-cli --release --target ${{ matrix.target }} ${{ matrix.kafka-features && format('--features "{0}"', matrix.kafka-features) || '' }}
          else
            cargo build -p camel-cli --release --target ${{ matrix.target }} ${{ matrix.kafka-features && format('--features "{0}"', matrix.kafka-features) || '' }}
          fi
        shell: bash

      - name: Rename binary
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/camel${{ matrix.bin-suffix }}" "dist/camel-${{ matrix.target }}${{ matrix.bin-suffix }}"
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: camel-${{ matrix.target }}
          path: dist/camel-${{ matrix.target }}${{ matrix.bin-suffix }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # xtask changelog needs full history + tags

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          # Resolve previous core tag (vX.Y.Z), excluding bridge tags.
          PREV=$(git tag --sort=-v:refname \
                 | grep -E '^v[0-9]' \
                 | grep -v "^${GITHUB_REF_NAME}$" \
                 | head -1)
          if [ -z "$PREV" ]; then
            echo "No previous core tag found; emitting minimal body."
            echo "body=Initial release." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "body<<__EOF__"
            cargo xtask changelog --from "$PREV" --to "${GITHUB_REF_NAME}"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: camel-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/camel-*
          body: ${{ steps.notes.outputs.body }}

  publish:
    name: Publish crates to crates.io
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Ensure publish script is executable
        run: chmod +x ./scripts/publish-crates.sh
      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: ./scripts/publish-crates.sh

  docker:
    name: Docker (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: production
            suffix: ""
            target: production
          - variant: alpine
            suffix: "-alpine"
            target: alpine
    env:
      REGISTRY_GHCR: ghcr.io
      REGISTRY_DOCKERHUB: docker.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download amd64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: camel-x86_64-unknown-linux-musl
          path: binary-amd64

      - name: Download arm64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: camel-aarch64-unknown-linux-musl
          path: binary-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY_DOCKERHUB }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}${{ matrix.suffix }}
            type=raw,value=latest${{ matrix.suffix }}

      - name: Prepare build context
        run: |
          mkdir -p context
          AMD64_BIN=$(find binary-amd64 -type f | head -1)
          ARM64_BIN=$(find binary-arm64 -type f | head -1)
          cp "$AMD64_BIN" context/camel-amd64
          cp "$ARM64_BIN" context/camel-arm64
          chmod +x context/camel-amd64 context/camel-arm64
          cp Dockerfile context/Dockerfile
          docker run --rm alpine:3.21 cat /etc/ssl/certs/ca-certificates.crt > context/ca-certificates.crt

      - name: Build and push amd64
        id: push-amd64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: context
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          build-args: TARGETARCH=amd64
          tags: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-amd64${{ matrix.suffix }}
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:latest-amd64${{ matrix.suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest amd64 image
        # Non-blocking: attestations fail with "Resource not accessible by
        # integration" on this repo (no toggle in security_and_analysis for
        # public user-owned repos — see v0.26.0 run 30847300641). Images push
        # fine; the block below must not be gated on attestation.
        continue-on-error: true
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push-amd64.outputs.digest }}
          push-to-registry: true

      - name: Build and push arm64
        id: push-arm64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: context
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          build-args: TARGETARCH=arm64
          tags: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-arm64${{ matrix.suffix }}
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:latest-arm64${{ matrix.suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest arm64 image
        continue-on-error: true
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push-arm64.outputs.digest }}
          push-to-registry: true

      - name: Create and push multi-arch manifest
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          for TAG in "${VERSION}${{ matrix.suffix }}" "latest${{ matrix.suffix }}"; do
            docker buildx imagetools create \
              -t ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:${TAG} \
              -t ${{ env.REGISTRY_DOCKERHUB }}/${{ env.IMAGE_NAME }}:${TAG} \
              ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:${VERSION}-amd64${{ matrix.suffix }} \
              ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:${VERSION}-arm64${{ matrix.suffix }}
          done
