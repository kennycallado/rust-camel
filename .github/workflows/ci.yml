name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  unit-tests:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Normal run 41-56 min; hangs must fail fast (rc-qdt3).
    timeout-minutes: 90
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Maximize disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/google/chrome /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h /
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install libclang for bindgen
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libclang-dev
      - name: Build
        run: cargo build --workspace
      - name: Install cargo-nextest
        uses: taiki-e/install-action@eba66cc6f87204a1e73f96e528e759b6c1fcf573 # cargo-nextest
        with:
          tool: cargo-nextest@0.9.143
      - name: Test (unit only — no Docker required)
        run: cargo nextest run --workspace --lib --profile ci

  macos-build-smoke:
    # macOS full unit suite runs weekly (ci-weekly.yml): macos minutes
    # cost 10x and the suite is slow (rc-wk29). Per-push keeps a build
    # gate plus a minimal smoke so platform compile breaks surface fast.
    name: macOS Build + Smoke
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Build
        run: cargo build --workspace
      - name: Smoke (camel-core lib)
        run: cargo test -p camel-core --lib

  full-tests-linux:
    name: Full Tests (ubuntu-latest)
    runs-on: ubuntu-latest
    # Normal run ~85 min; a hung test binary must fail fast instead of
    # burning the runner to the 6h platform limit (rc-y24l).
    timeout-minutes: 120
    env:
      # ENOSPC mitigation: strip debug info from dev/test profiles.
      # Line-table backtraces are not needed to gate merges; rerun
      # failures locally with debug info when diagnosing.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/google/chrome /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h /
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install libclang for bindgen
        run: sudo apt-get install -y libclang-dev
      - name: Docker availability
        run: docker info
      - name: Pull container test images
        run: docker pull alpine:latest
      - name: Build
        run: cargo build --workspace
      - name: Hexagonal boundaries (camel-core)
        run: cargo test -p camel-core --test hexagonal_architecture_boundaries_test
      - name: Build JMS bridge binary
        run: cargo xtask build-jms-bridge
      - name: JMS integration tests
        env:
          CAMEL_JMS_BRIDGE_BINARY_PATH: ${{ github.workspace }}/bridges/jms/build/native/jms-bridge
        run: cargo test -p camel-test --features integration-tests --test jms_test
      - name: Reclaim JMS bridge artifacts
        # Kill the bridge process too: orphans hold ports and pollute
        # later steps (rc-qdt3).
        run: |
          pkill -x jms-bridge || true
          rm -rf bridges/jms/build bridges/jms/.gradle-docker-cache
      - name: Build XML bridge binary
        run: cargo xtask build-xml-bridge
      - name: XML bridge integration tests
        env:
          CAMEL_XML_BRIDGE_BINARY_PATH: ${{ github.workspace }}/bridges/xml/build/native/xml-bridge
        run: cargo test -p camel-test --features integration-tests --test xml_bridge_validator_test --test xml_bridge_xslt_test --test xml_bridge_xerces_diagnostics_test
      - name: Reclaim XML bridge artifacts
        run: |
          pkill -x xml-bridge || true
          rm -rf bridges/xml/build bridges/xml/.gradle-docker-cache
      - name: Build CXF bridge binary
        run: cargo xtask build-cxf-bridge
      - name: CXF bridge integration tests
        env:
          CAMEL_CXF_BRIDGE_BINARY_PATH: ${{ github.workspace }}/bridges/cxf/build/native/cxf-bridge
        run: cargo test -p camel-test --features integration-tests --test cxf_test
      - name: Reclaim CXF bridge artifacts
        run: |
          pkill -x cxf-bridge || true
          rm -rf bridges/cxf/build bridges/cxf/.gradle-docker-cache
      - name: Container integration tests
        run: cargo test -p camel-test --features integration-tests --test container_test
      - name: Kafka integration tests (testcontainers)
        run: cargo test -p camel-test --features integration-tests --test kafka_test
      - name: Component emission integration tests (testcontainers)
        run: cargo test -p camel-test --features integration-tests --test component_emission_test
      - name: Redis integration tests (testcontainers)
        run: cargo test -p camel-test --features integration-tests --test redis_test
      - name: Redis repositories integration tests (testcontainers)
        run: cargo test -p camel-test --features integration-tests --test redis_repositories_test
      - name: Cache payload offload integration tests (testcontainers)
        run: cargo test -p camel-test --features integration-tests --test cache_payload_offload
      - name: OpenSearch integration tests (testcontainers)
        run: cargo test -p camel-test --features integration-tests --test opensearch_test
      - name: Kubernetes integration tests (testcontainers K3s)
        run: cargo test -p camel-test --features integration-tests --test kubernetes_test
      - name: Auth multi-credential integration tests
        run: cargo test -p camel-test --features integration-tests --test auth_multi_credential_test
      - name: Kernel fail-closed integration tests
        run: cargo test -p camel-test --features integration-tests --test kernel_fail_closed_test
      - name: Reclaim disk before full workspace test
        # Drop the GraalVM builder image (~5GB), testcontainers images,
        # and Docker build cache before compiling every test target in
        # the workspace — the peak-disk moment of this job.
        run: |
          docker system prune -af --volumes || true
          df -h /
      - name: Compile-gate gated integration test set
        # Compile-only gate for the integration-tests-gated test binaries
        # (e.g. master_kubernetes_test). bd rc-8g35d: a compile-broken
        # master_kubernetes_test stayed invisible to CI because plain
        # `cargo test --workspace` skips files gated behind
        # #![cfg(feature = "integration-tests")]. rc-khjnb: this step
        # makes gated-test compile drift fail CI. No Docker or runtime
        # required — cargo check only.
        run: cargo check -p camel-test --features integration-tests --tests
      - name: Compile-gate narrow cxf integration feature
        # bd rc-z1ea2: --all-features clippy and the wide
        # --features integration-tests steps activate dep:camel-component-cxf
        # as part of a wider union, so neither can catch a defect confined to
        # the integration-tests-cxf feature line. Without this gate, a compile
        # break in the narrow cxf_test target stays invisible to CI.
        # This command mirrors the compile the published-bridge smoke runs
        # (compile + link, no execution). No Docker or runtime is required,
        # keeping the gate cheap.
        run: cargo test -p camel-test --features integration-tests-cxf --test cxf_test --no-run
      - name: Test (full workspace)
        run: cargo test --workspace
      - name: Test camel-cli (exec flavor)
        # rc-zrta1: the workspace test above resolves camel-cli's default
        # flavor-regular. Since ADR-0037-A1 regular INCLUDES exec, the
        # exec-gated run_exec_guard_test battery (4 tests) compiles there;
        # this explicit flavor-regular,exec leg keeps that true even if the
        # placement ever reverts, with the same closure and without the
        # kafka/surrealdb/containers rebuild of flavor-full.
        run: cargo test -p camel-cli --no-default-features --features flavor-regular,exec

  docker-smoke-test:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    # ~18 min warm, ~41 min cold cache (run 33801679630); cancelled jobs skip cache save (run 33887809098).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/google/chrome /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h /
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install musl-tools
        run: sudo apt-get install -y musl-tools
      - name: Install target
        run: rustup target add x86_64-unknown-linux-musl
      - name: Build musl binary
        run: cargo build -p camel-cli --release --target x86_64-unknown-linux-musl
      - name: Prepare Docker context
        run: |
          mkdir -p context
          cp target/x86_64-unknown-linux-musl/release/camel context/camel-amd64
          chmod +x context/camel-amd64
          cp Dockerfile context/Dockerfile
          docker run --rm alpine:3.21 cat /etc/ssl/certs/ca-certificates.crt > context/ca-certificates.crt
      - name: Build production image
        run: docker build --target production -t camel-smoke:production context/
      - name: Build slim image
        run: docker build --target slim -t camel-smoke:slim context/
      - name: Test production image
        run: |
          OUTPUT=$(docker run --rm camel-smoke:production --version)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "camel"
      - name: Test slim image
        run: |
          OUTPUT=$(docker run --rm camel-smoke:slim --version)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "camel"
      - name: Build gnu binary
        run: cargo build -p camel-cli --release
      - name: Prepare gnu Docker context
        run: cp target/release/camel context/camel-amd64
      - name: Build gnu image
        run: docker build --target gnu -t camel-smoke:gnu context/
      - name: Test gnu image
        run: |
          OUTPUT=$(docker run --rm camel-smoke:gnu --version)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "camel"
      - name: Build fake-bridge fixture
        run: |
          cargo build -p camel-fake-bridge --release --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/camel-fake-bridge context/camel-fake-bridge
      - name: Bridge container guard
        env:
          FAKE_BRIDGE_BIN: context/camel-fake-bridge
        run: bash .github/scripts/docker-bridge-guard.sh

  coverage:
    name: Coverage Check
    runs-on: ubuntu-latest
    # Cold-cache observed at 55 min (rc-qdt3).
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/google/chrome /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h /
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install libclang for bindgen
        run: sudo apt-get install -y libclang-dev
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@eba66cc6f87204a1e73f96e528e759b6c1fcf573 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov
      - name: Build
        run: cargo build --workspace
      - name: Run coverage check
        run: ./scripts/coverage.sh

  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    # Normal run 8-17 min (rc-qdt3).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/google/chrome /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h /
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install libclang for bindgen
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: fmt check
        run: cargo fmt --check --all
      - name: clippy
        # --all-features activates dynamic-linking which requires system librdkafka
        # (unavailable on ubuntu-latest). Exclude camel-cli and camel-component-kafka
        # so dynamic-linking doesn't propagate; check them separately with defaults.
        run: |
          cargo clippy --workspace --all-features \
            --exclude camel-cli \
            --exclude camel-component-kafka \
            -- -D warnings
          cargo clippy -p camel-component-kafka --all-targets -- -D warnings
          cargo clippy -p camel-cli -- -D warnings
          # rc-6obii: the camel-cli leg above resolves default features
          # only (flavor-regular, no exec) — the exec-gated cfg blocks
          # and run_exec_guard_test never lint in CI. Mirror the rc-zrta1
          # test leg's feature set, with --all-targets for the gated tests.
          cargo clippy -p camel-cli --no-default-features \
            --features flavor-regular,exec --all-targets -- -D warnings
      - name: lint-unwrap
        run: cargo xtask lint-unwrap
      - name: lint-glob-imports
        run: cargo xtask lint-glob-imports
      - name: lint-unsafe-safety
        run: cargo xtask lint-unsafe-safety
      - name: lint-missing-docs-ratchet
        run: cargo xtask lint-missing-docs-ratchet
      - name: lint-secrets
        run: cargo xtask lint-secrets
      - name: lint-single-source
        run: cargo xtask lint-single-source
      - name: lint-non-exhaustive
        run: cargo xtask lint-non-exhaustive
      - name: lint-log-levels
        run: cargo xtask lint-log-levels
      - name: lint-log-redaction
        run: cargo xtask lint-log-redaction
      - name: lint-cancel-tokens
        run: cargo xtask lint-cancel-tokens
      - name: lint-test-sleep
        run: cargo xtask lint-test-sleep
      - name: lint-no-free-port
        run: cargo xtask lint-no-free-port
      - name: lint-no-raw-http-test-server
        run: cargo xtask lint-no-raw-http-test-server
      - name: lint-no-env-mutation-unguarded
        run: cargo xtask lint-no-env-mutation-unguarded
      - name: lint-unbounded-wait
        run: cargo xtask lint-unbounded-wait
      - name: lint-ignore
        run: cargo xtask lint-ignore
      - name: lint-publish-cycles
        run: cargo xtask lint-publish-cycles
      - name: lint-publish-registration
        run: cargo xtask lint-publish-registration
      - name: lint-component-deps
        run: cargo xtask lint-component-deps
      - name: lint-bridge-versions
        run: cargo xtask lint-bridge-versions
      - name: lint-context-citations
        run: cargo xtask lint-context-citations
      - name: lint-metric-labels
        run: cargo xtask lint-metric-labels
      - name: lint-gate-forwarding
        run: cargo xtask lint-gate-forwarding
      - name: lint-no-deprecated
        run: cargo xtask lint-no-deprecated
      - name: schema-check
        run: cargo xtask schema --check
      - name: lint-commits
        # Fail if any commit in the PR range mentions breaking in prose
        # without the conventional `!:` subject marker. Default checkout
        # lacks origin/main, so fetch it explicitly.
        run: |
          git fetch origin main --depth=1
          cargo xtask changelog --check --from FETCH_HEAD --to HEAD
      - name: cargo-audit (vulnerability scan)
        uses: taiki-e/install-action@eba66cc6f87204a1e73f96e528e759b6c1fcf573 # cargo-audit
        with:
          tool: cargo-audit
      - name: audit
        run: cargo audit

  bench-smoke:
    # Criterion bench targets are NOT compiled by `cargo build --workspace`;
    # this job compiles and runs the smoke subset itself. Container
    # full-matrix stays manual: benchmarks/bench run-all.
    name: Bench Smoke
    runs-on: ubuntu-latest
    # 20 not 10: cold cache after a ~6-weekly rust-cache invalidation
    # (toolchain bump) compiles the criterion targets from scratch on a
    # 4-vCPU runner, which brushes the old 10 min pin (rc-p2vm). Warm
    # runs stay ~3 min; the wider budget only absorbs cold-start noise.
    # +5 min also covers the new camel-language-rhai guard bench target
    # compile (rc-m01r9).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Maximize disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/google/chrome /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h /
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install libclang for bindgen
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libclang-dev
      - name: Bench facade smoke (help)
        run: bash benchmarks/bench help
      - name: Bench facade smoke (dry-run, no JDK)
        run: bash benchmarks/bench run --scenarios=t2-json,split-aggregate --dry-run
      - name: Records guard (summaries must regenerate)
        run: python3 benchmarks/harness/summarize.py --check benchmarks/records
      - name: Bench smoke (quick mode)
        run: cargo bench -p camel-bench --bench pipeline --bench body_coercion -- --quick
      - name: Rhai property-scaling guard (expected-fail)
        env:
          RHAI_GUARD_EXPECT_FAIL: "1"
        run: cargo bench -p camel-language-rhai --bench property_scaling
      # Absolute gates are runner-class smoke ceilings (shared 4-vCPU runner,
      # ~2.5x the local 100/250 us gates). The baseline env wires the
      # matched-p95 check: it SKIPS with a printed cpu/host mismatch reason on
      # runners differing from the recorded provenance and enforces <=110% on
      # provenance-matched runners. The binding acceptance is the matched
      # same-machine pre/post evidence recorded by the mission. The baseline
      # path is package-relative: cargo bench runs the bench binary with its
      # cwd set to the crate root, not the workspace root.
      - name: Rhai eval-overhead guard (absolute gates + matched p95)
        env:
          RHAI_EVAL_OVERHEAD_MAX_TRIVIAL_US: "250"
          RHAI_EVAL_OVERHEAD_MAX_CHOICE_US: "500"
          RHAI_EVAL_OVERHEAD_BASELINE: benches/eval_overhead_baseline.txt
        run: cargo bench -p camel-language-rhai --bench eval_overhead
      # Absolute gates are runner-class smoke ceilings (shared 4-vCPU runner,
      # ~2.5x the local 9/250 us gates). The baseline env wires the matched
      # baseline check: it SKIPS with a printed cpu/host mismatch reason on
      # runners differing from the recorded provenance and enforces <=110% on
      # provenance-matched runners. The binding acceptance is the matched
      # same-machine pre/post evidence recorded by the mission. The baseline
      # path is package-relative: cargo bench runs the bench binary with its
      # cwd set to the crate root, not the workspace root.
      - name: Simple eval guard (absolute gates + matched baseline)
        env:
          SIMPLE_CHOICE_MAX_US: "22"
          SIMPLE_25STEP_MAX_US: "625"
          SIMPLE_EVAL_BASELINE: benches/expression_eval_baseline.txt
        run: cargo bench -p camel-language-simple --bench expression_eval

  wasm-integration:
    name: WASM Integration (ubuntu-latest)
    runs-on: ubuntu-latest
    # Normal run 6-14 min (rc-qdt3).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/google/chrome /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h /
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install libclang for bindgen
        run: sudo apt-get install -y libclang-dev
      - name: Build WASM guest crates
        run: |
          # Build all guest crates that produce .wasm components.
          # A guest compile failure MUST fail the job — this is the
          # primary oracle for detecting WIT version breakage (ADR-0054).
          for guest in examples/wasm-source-webhook/guest \
                       examples/wasm-bean-example/guest \
                       examples/wasm-streaming-plugin/guest \
                       examples/security-wasm-policy/guest \
                       examples/security-wasm-policy/guest-init-check \
                       examples/wasm-example/guest \
                       crates/components/camel-component-wasm/tests/fixtures/conflicting-bind-guest; do
            echo "::group::Building $guest"
            (cd "$guest" && cargo build --target wasm32-wasip2 2>&1)
            echo "::endgroup::"
          done
      - name: WASM integration tests (per-target, --ignored)
        run: |
          # Run buildable #[ignore] tests per cargo test target.
          # Targets are derived from allowlist-ignore.txt so that
          # adding a new requires pre-built file + allowlist entry
          # automatically wires it into CI (ADR-0054 bidirectional contract).
          for entry in $(grep -vE '^(#|$)' scripts/xtask/allowlist-ignore.txt); do
            target=$(basename "$entry" .rs)
            echo "Running --ignored tests for target: $target"
            cargo test -p camel-component-wasm --test "$target" -- --ignored
          done
