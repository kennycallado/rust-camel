name: Release matrix

on:
  workflow_call:
    inputs:
      publish:
        description: "Execute the publish path (logins, registry pushes, GH release)"
        type: boolean
        required: false
        default: false
      dev-profile:
        description: "Trim the build matrix to the 3-leg dev subset"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- slim: edge pack. Native musl legs carry jemalloc (allocator
          # selection, not closure selection). x86-musl is runnable on the
          # runner -> kafka-absence-probe; aarch64-musl is cross -> exempt.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use-cross: false
            bin-suffix: ""
            install-musl-tools: true
            alloc-features: "jemalloc"
            flavor: "flavor-slim"
            no-default-features: true
            artifact-name: "camel-slim-x86_64-unknown-linux-musl"
            upload: true
            in-dev-profile: false
            kafka-absence-probe: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use-cross: true
            bin-suffix: ""
            alloc-features: "jemalloc"
            flavor: "flavor-slim"
            no-default-features: true
            artifact-name: "camel-slim-aarch64-unknown-linux-musl"
            upload: true
            in-dev-profile: false
          # ---- regular: keeps the clean legacy name on the 4 Linux
          # targets (plus a darwin compile-guard that never uploads). Never
          # kafka-probe/install-librdkafka (kafka is absent by design).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use-cross: false
            bin-suffix: ""
            flavor: "flavor-regular"
            artifact-name: "camel-x86_64-unknown-linux-gnu"
            upload: true
            in-dev-profile: false
            kafka-absence-probe: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use-cross: true
            bin-suffix: ""
            flavor: "flavor-regular"
            artifact-name: "camel-aarch64-unknown-linux-gnu"
            upload: true
            in-dev-profile: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use-cross: false
            bin-suffix: ""
            install-musl-tools: true
            alloc-features: "jemalloc"
            flavor: "flavor-regular"
            artifact-name: "camel-x86_64-unknown-linux-musl"
            upload: true
            in-dev-profile: true
            kafka-absence-probe: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use-cross: true
            bin-suffix: ""
            alloc-features: "jemalloc"
            flavor: "flavor-regular"
            artifact-name: "camel-aarch64-unknown-linux-musl"
            upload: true
            in-dev-profile: false
          - os: macos-15-intel
            target: x86_64-apple-darwin
            use-cross: false
            bin-suffix: ""
            flavor: "flavor-regular"
            artifact-name: "camel-x86_64-apple-darwin"
            # compile-guard only: proves the regular closure builds on
            # darwin for cargo-install source users; never uploaded.
            upload: false
            in-dev-profile: true
            kafka-absence-probe: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use-cross: false
            bin-suffix: ""
            flavor: "flavor-full"
            artifact-name: "camel-full-x86_64-unknown-linux-gnu"
            upload: true
            in-dev-profile: true
            kafka-probe: true
            install-librdkafka: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            use-cross: false
            bin-suffix: ""
            flavor: "flavor-full"
            artifact-name: "camel-full-aarch64-unknown-linux-gnu"
            upload: true
            in-dev-profile: false
            kafka-probe: true
            install-librdkafka: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            use-cross: false
            bin-suffix: ""
            flavor: "flavor-full"
            artifact-name: "camel-full-x86_64-apple-darwin"
            upload: true
            in-dev-profile: false
            kafka-probe: true
          - os: macos-latest
            target: aarch64-apple-darwin
            use-cross: false
            bin-suffix: ""
            flavor: "flavor-full"
            artifact-name: "camel-full-aarch64-apple-darwin"
            upload: true
            in-dev-profile: false
            kafka-probe: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use-cross: false
            bin-suffix: ".exe"
            flavor: "flavor-full"
            artifact-name: "camel-full-x86_64-pc-windows-msvc"
            upload: true
            in-dev-profile: false
            kafka-probe: true

    steps:
      # NOTE: dev gating is step-level — job-level if cannot access the
      # matrix context (GitHub parses job-if before matrix expansion;
      # discovered at CI rehearsal 2026-09-19). Non-dev legs skip all
      # steps (empty green) under dev-profile.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !inputs.dev-profile || matrix.in-dev-profile }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        if: ${{ !inputs.dev-profile || matrix.in-dev-profile }}
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        if: ${{ !inputs.dev-profile || matrix.in-dev-profile }}

      - name: Install cmake (Windows)
        if: ${{ matrix.os == 'windows-latest' && (!inputs.dev-profile || matrix.in-dev-profile) }}
        run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y

      - name: Install build deps (Linux native)
        if: ${{ matrix.install-librdkafka == true && (!inputs.dev-profile || matrix.in-dev-profile) }}
        run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev libssl-dev libsasl2-dev

      - name: Install musl-tools
        if: ${{ matrix.install-musl-tools == true && (!inputs.dev-profile || matrix.in-dev-profile) }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install target
        if: ${{ matrix.use-cross == false && (!inputs.dev-profile || matrix.in-dev-profile) }}
        run: rustup target add ${{ matrix.target }}

      - name: Install cross
        if: ${{ matrix.use-cross == true && (!inputs.dev-profile || matrix.in-dev-profile) }}
        run: cargo install cross --version 0.2.5 --locked

      - name: Build binary
        if: ${{ !inputs.dev-profile || matrix.in-dev-profile }}
        env:
          FLAVOR: ${{ matrix.flavor }}
          ALLOC_FEATURES: ${{ matrix.alloc-features }}
        run: |
          # Single flavor marker per leg (single source of truth, no
          # composed feature lists); allocator joins with a plain
          # conditional expansion — empty ALLOC_FEATURES must not leave
          # a leading comma (rc-vnm8 class).
          FEATURES="${FLAVOR}${ALLOC_FEATURES:+,$ALLOC_FEATURES}"
          # Slim legs MUST drop default features: default = flavor-regular
          # and marker priority is full > regular > slim, so without this
          # flag a slim leg silently builds the REGULAR closure (caught by
          # the version-flavor assert at the rc.1 CI rehearsal).
          NO_DEFAULT=""
          if [[ "${{ matrix.no-default-features }}" == "true" ]]; then
            NO_DEFAULT="--no-default-features"
          fi
          echo "Building ${{ matrix.target }} with: $NO_DEFAULT --features $FEATURES"
          if [[ "${{ matrix.use-cross }}" == "true" ]]; then
            cross build -p camel-cli --release --target "${{ matrix.target }}" $NO_DEFAULT --features "$FEATURES"
          else
            cargo build -p camel-cli --release --target "${{ matrix.target }}" $NO_DEFAULT --features "$FEATURES"
          fi
        shell: bash

      - name: Assert kafka capability (release probe)
        if: ${{ matrix.kafka-probe == true && (!inputs.dev-profile || matrix.in-dev-profile) }}
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE="$RUNNER_TEMP/kafka-probe-route.yaml"
          printf '%s\n' \
            'routes:' \
            '  - id: "kafka-capability-probe"' \
            '    from: "kafka:orders?brokers=localhost:9092"' \
            '    steps:' \
            '      - to: "log:out"' \
            > "$FIXTURE"
          BIN="target/${{ matrix.target }}/release/camel${{ matrix.bin-suffix }}"
          set +e
          OUT="$("$BIN" lint "$FIXTURE" 2>&1)"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "FAIL: kafka capability probe exited $RC"
            printf '%s\n' "$OUT"
            exit 1
          fi
          if printf '%s\n' "$OUT" | grep -iq 'unverified-scheme'; then
            echo "FAIL: unverified-scheme diagnostic in a kafka-capability build"
            printf '%s\n' "$OUT"
            exit 1
          fi
          echo "OK: kafka capability verified on ${{ matrix.target }}"

      - name: Assert kafka absence (slim/regular probe)
        if: ${{ matrix.kafka-absence-probe == true && (!inputs.dev-profile || matrix.in-dev-profile) }}
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE="$RUNNER_TEMP/kafka-absence-probe-route.yaml"
          printf '%s\n' \
            'routes:' \
            '  - id: "kafka-absence-probe"' \
            '    from: "kafka:test-topic"' \
            '    steps:' \
            '      - to: "log:out"' \
            > "$FIXTURE"
          BIN="target/${{ matrix.target }}/release/camel${{ matrix.bin-suffix }}"
          set +e
          OUT="$("$BIN" lint "$FIXTURE" 2>&1)"
          RC=$?
          set -e
          # Absence manifests as an Info `unverified-scheme` note with
          # exit 0 (camel-lint semantics). Both halves are required:
          # RC≠0 means the probe itself broke (fixture drift, engine
          # failure) — a false green if treated as absence.
          if [ "$RC" -ne 0 ]; then
            echo "FAIL: probe broken — lint exited $RC (expected exit 0 with an unverified-scheme note)"
            printf '%s\n' "$OUT"
            exit 1
          fi
          if ! printf '%s\n' "$OUT" | grep -iq 'unverified-scheme'; then
            echo "FAIL: kafka route accepted by a slim/regular build — closure leaked"
            printf '%s\n' "$OUT"
            exit 1
          fi
          echo "OK: kafka correctly absent on ${{ matrix.target }}"

      - name: Assert version flavor
        if: ${{ matrix.use-cross != true && (!inputs.dev-profile || matrix.in-dev-profile) }}
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/camel${{ matrix.bin-suffix }}"
          EXPECTED="${{ matrix.flavor }}"
          EXPECTED="${EXPECTED#flavor-}"
          OUT="$("$BIN" --version)"
          printf '%s\n' "$OUT"
          case "$OUT" in
            *" ($EXPECTED)") ;;
            *) echo "FAIL: expected flavor suffix ($EXPECTED)"; exit 1 ;;
          esac

      - name: Assert jemalloc linked (musl only)
        if: ${{ contains(matrix.alloc-features, 'jemalloc') && (!inputs.dev-profile || matrix.in-dev-profile) }}
        run: |
          # Build-green does not prove the allocator was linked — a feature
          # typo or resolver quirk silently yields musl mallocng (the exact
          # RSS retention bug rc-vnm8 fixes). Assert the symbol fingerprint.
          BIN="target/${{ matrix.target }}/release/camel"
          if nm "$BIN" 2>/dev/null | grep -q ' je_arena_' || strings "$BIN" | grep -q 'jemalloc'; then
            echo "OK: jemalloc linked into ${{ matrix.target }}"
          else
            echo "FAIL: jemalloc NOT linked into ${{ matrix.target }} — would ship mallocng"
            exit 1
          fi
        shell: bash

      - name: Pack tarball and sidecar
        if: ${{ (!inputs.dev-profile || matrix.in-dev-profile) && matrix.upload != false }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # flavor probes already ran on the bare binary above — packaging only
          tar -C "target/${{ matrix.target }}/release" -czf \
            "dist/${{ matrix.artifact-name }}.tar.gz" \
            "camel${{ matrix.bin-suffix }}"
          # Canonical sidecar "<hex>  <basename>" (GNU text format, two
          # spaces) on every platform. git-bash sha256sum emits the
          # MSYS binary-mode marker " * " instead (rehearsal v0.51.0-rc.1),
          # so extract the digest field and printf the line ourselves.
          # macOS runners lack coreutils; shasum -a 256 gives the same field.
          if command -v sha256sum >/dev/null 2>&1; then
            HASH="$(sha256sum "dist/${{ matrix.artifact-name }}.tar.gz" | cut -d' ' -f1)"
          else
            HASH="$(shasum -a 256 "dist/${{ matrix.artifact-name }}.tar.gz" | cut -d' ' -f1)"
          fi
          printf '%s  %s\n' "$HASH" "${{ matrix.artifact-name }}.tar.gz" \
            > "dist/${{ matrix.artifact-name }}.tar.gz.sha256"
        shell: bash

      - name: Upload artifact
        if: ${{ (!inputs.dev-profile || matrix.in-dev-profile) && matrix.upload != false }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            dist/${{ matrix.artifact-name }}.tar.gz*

  release:
    name: Create GitHub Release
    if: inputs.publish
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # xtask changelog needs full history + tags

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          # Resolve previous core tag (vX.Y.Z), excluding bridge tags.
          PREV=$(git tag --sort=-v:refname \
                 | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                 | grep -v "^${GITHUB_REF_NAME}$" \
                 | head -1)
          if [ -z "$PREV" ]; then
            echo "No previous core tag found; emitting minimal body."
            echo "body=Initial release." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "body<<__EOF__"
            cargo xtask changelog --from "$PREV" --to "${GITHUB_REF_NAME}"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: camel-*
          merge-multiple: true

      - name: Assert artifact flavor suffixes
        shell: bash
        run: |
          set -euo pipefail
          # 12-entry matrix, 11 uploading: 2 slim + 5 full + 4 regular tarballs
          # + 11 matching sidecars = 22 files. Filename-based only.
          REGULAR_NAMES=(
            camel-x86_64-unknown-linux-gnu.tar.gz
            camel-aarch64-unknown-linux-gnu.tar.gz
            camel-x86_64-unknown-linux-musl.tar.gz
            camel-aarch64-unknown-linux-musl.tar.gz
          )
          FULL_NAMES=(
            camel-full-x86_64-unknown-linux-gnu.tar.gz
            camel-full-aarch64-unknown-linux-gnu.tar.gz
            camel-full-x86_64-apple-darwin.tar.gz
            camel-full-aarch64-apple-darwin.tar.gz
            camel-full-x86_64-pc-windows-msvc.tar.gz
          )
          SLIM_NAMES=(
            camel-slim-x86_64-unknown-linux-musl.tar.gz
            camel-slim-aarch64-unknown-linux-musl.tar.gz
          )
          ok=1; slim=0; full=0; reg=0; side=0
          declare -A seen_tgz
          for f in dist/*; do
            b="$(basename "$f")"
            case "$b" in
              *.tar.gz.sha256)
                side=$((side+1))
                tgz="${b%.sha256}"
                [ -f "dist/$tgz" ] || { echo "FAIL: sidecar without tarball: $b"; ok=0; }
                # format: 64 lowercase hex + exactly two spaces + own basename
                head -1 "$f" | grep -Eq "^[0-9a-f]{64}  ${tgz}$" \
                  || { echo "FAIL: sidecar format: $b"; ok=0; }
                ;;
              *.tar.gz)
                if printf '%s\n' "${SLIM_NAMES[@]}" | grep -qxF "$b"; then slim=$((slim+1));
                elif printf '%s\n' "${FULL_NAMES[@]}" | grep -qxF "$b"; then full=$((full+1));
                elif printf '%s\n' "${REGULAR_NAMES[@]}" | grep -qxF "$b"; then reg=$((reg+1));
                else echo "FAIL: unexpected tarball: $b"; ok=0; fi
                [ -z "${seen_tgz[$b]:-}" ] || { echo "FAIL: dup: $b"; ok=0; }
                seen_tgz[$b]=1
                ;;
              *)
                echo "FAIL: unexpected file (raw binaries are retired): $b"; ok=0 ;;
            esac
          done
          [ "$slim" -eq 2 ] || { echo "FAIL: slim=$slim want 2"; ok=0; }
          [ "$full" -eq 5 ] || { echo "FAIL: full=$full want 5"; ok=0; }
          [ "$reg"  -eq 4 ] || { echo "FAIL: regular=$reg want 4"; ok=0; }
          [ "$side" -eq 11 ] || { echo "FAIL: sidecars=$side want 11"; ok=0; }
          [ "$ok" -eq 1 ] || exit 1

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/camel-*
          body: ${{ steps.notes.outputs.body }}

  docker:
    name: Docker (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: production
            suffix: ""
            target: production
            amd64-artifact: camel-x86_64-unknown-linux-musl
            arm64-artifact: camel-aarch64-unknown-linux-musl
            in-dev: false
            semantic-tag: regular
          - variant: alpine
            suffix: "-alpine"
            target: alpine
            amd64-artifact: camel-slim-x86_64-unknown-linux-musl
            arm64-artifact: camel-slim-aarch64-unknown-linux-musl
            in-dev: false
            semantic-tag: slim
          - variant: gnu
            suffix: "-gnu"
            target: gnu
            amd64-artifact: camel-full-x86_64-unknown-linux-gnu
            arm64-artifact: camel-full-aarch64-unknown-linux-gnu
            in-dev: true
            semantic-tag: full
    env:
      REGISTRY_GHCR: ghcr.io
      REGISTRY_DOCKERHUB: docker.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      # NOTE: dev gating is step-level — job-level if cannot access the
      # matrix context (GitHub parses job-if before matrix expansion;
      # discovered at CI rehearsal 2026-09-19). Non-dev legs skip all
      # steps (empty green) under dev-profile.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !inputs.dev-profile || matrix.in-dev }}

      - name: Extract version
        if: ${{ inputs.publish && (!inputs.dev-profile || matrix.in-dev) }}
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download amd64 artifact
        if: ${{ !inputs.dev-profile || matrix.in-dev }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.amd64-artifact }}
          path: binary-amd64

      # Artifacts are tarball+sidecar since the pack change; verify the
      # checksum before anything consumes the binary.
      - name: Verify and extract amd64
        if: ${{ !inputs.dev-profile || matrix.in-dev }}
        shell: bash
        run: |
          set -euo pipefail
          cd binary-amd64
          sha256sum -c "${{ matrix.amd64-artifact }}.tar.gz.sha256"
          mkdir -p out && tar -xzf "${{ matrix.amd64-artifact }}.tar.gz" -C out

      - name: Download arm64 artifact
        if: ${{ !inputs.dev-profile }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.arm64-artifact }}
          path: binary-arm64

      - name: Verify and extract arm64
        if: ${{ !inputs.dev-profile }}
        shell: bash
        run: |
          set -euo pipefail
          cd binary-arm64
          sha256sum -c "${{ matrix.arm64-artifact }}.tar.gz.sha256"
          mkdir -p out && tar -xzf "${{ matrix.arm64-artifact }}.tar.gz" -C out

      # Runtime flavor check for the downloaded amd64 binary — closes the
      # seam the dev smoke cannot: dev mode builds only the gnu variant,
      # and publish mode skips the image smoke entirely. Without this, a
      # swapped *-artifact key would ship wrong-flavor images with no CI
      # failure. amd64-only: arm64 binaries are not runnable on this
      # runner (filename assert in the release job covers them).
      - name: Assert amd64 binary flavor (variant lockstep)
        if: ${{ !inputs.dev-profile || matrix.in-dev }}
        shell: bash
        run: |
          set -euo pipefail
          BIN="binary-amd64/out/camel"
          chmod +x "$BIN"
          case "${{ matrix.variant }}" in
            production) EXPECTED="regular" ;;
            alpine) EXPECTED="slim" ;;
            gnu) EXPECTED="full" ;;
            *) echo "unknown variant"; exit 1 ;;
          esac
          OUT="$("$BIN" --version)"
          printf '%s\n' "$OUT"
          case "$OUT" in
            *" ($EXPECTED)") ;;
            *) echo "FAIL: ${{ matrix.variant }} image expects ($EXPECTED), got: $OUT"; exit 1 ;;
          esac

      - name: Set up QEMU
        if: ${{ !inputs.dev-profile || matrix.in-dev }}
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        if: ${{ !inputs.dev-profile || matrix.in-dev }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        if: ${{ inputs.publish && (!inputs.dev-profile || matrix.in-dev) }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ inputs.publish && (!inputs.dev-profile || matrix.in-dev) }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        if: ${{ inputs.publish && (!inputs.dev-profile || matrix.in-dev) }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY_DOCKERHUB }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}${{ matrix.suffix }}
            type=raw,value=latest${{ matrix.suffix }}

      - name: Prepare build context
        if: ${{ !inputs.dev-profile || matrix.in-dev }}
        run: |
          mkdir -p context
          cp binary-amd64/out/camel context/camel-amd64
          chmod +x context/camel-amd64
          # Dev runs only carry the amd64 artifact (no separate arm64 dev
          # image build), so the arm64 binary is only staged for publish.
          if [ "${{ inputs.dev-profile }}" != "true" ]; then
            cp binary-arm64/out/camel context/camel-arm64
            chmod +x context/camel-arm64
          fi
          cp Dockerfile context/Dockerfile
          docker run --rm alpine:3.21 cat /etc/ssl/certs/ca-certificates.crt > context/ca-certificates.crt

      - name: Build dev image (amd64 --load)
        if: ${{ inputs.publish != true && (!inputs.dev-profile || matrix.in-dev) }}
        run: docker buildx build --load --platform linux/amd64 --build-arg TARGETARCH=amd64 --target ${{ matrix.target }} -t camel:dev-${{ matrix.variant }} context
        shell: bash

      - name: Smoke dev image (assert flavor suffix)
        if: ${{ inputs.publish != true && (!inputs.dev-profile || matrix.in-dev) }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(docker run --rm camel:dev-${{ matrix.variant }} --version)"
          printf '%s\n' "$OUT"
          case "${{ matrix.variant }}" in
            production) EXPECTED="regular" ;;
            alpine) EXPECTED="slim" ;;
            gnu) EXPECTED="full" ;;
          esac
          case "$OUT" in
            *" ($EXPECTED)") ;;
            *) echo "FAIL: expected flavor suffix ($EXPECTED)"; exit 1 ;;
          esac

      - name: Build and push amd64
        if: ${{ inputs.publish && (!inputs.dev-profile || matrix.in-dev) }}
        id: push-amd64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: context
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          build-args: TARGETARCH=amd64
          tags: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-amd64${{ matrix.suffix }}
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:latest-amd64${{ matrix.suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest amd64 image
        if: ${{ inputs.publish && (!inputs.dev-profile || matrix.in-dev) }}
        # Non-blocking: attestations fail with "Resource not accessible by
        # integration" on this repo (no toggle in security_and_analysis for
        # public user-owned repos — see v0.26.0 run 30847300641). Images push
        # fine; the block below must not be gated on attestation.
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push-amd64.outputs.digest }}
          push-to-registry: true

      - name: Build and push arm64
        if: ${{ inputs.publish && (!inputs.dev-profile || matrix.in-dev) }}
        id: push-arm64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: context
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          build-args: TARGETARCH=arm64
          tags: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-arm64${{ matrix.suffix }}
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:latest-arm64${{ matrix.suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest arm64 image
        if: ${{ inputs.publish && (!inputs.dev-profile || matrix.in-dev) }}
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push-arm64.outputs.digest }}
          push-to-registry: true

      - name: Create and push multi-arch manifest
        if: ${{ inputs.publish && (!inputs.dev-profile || matrix.in-dev) }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          for TAG in "${VERSION}${{ matrix.suffix }}" "latest${{ matrix.suffix }}" "${{ matrix.semantic-tag }}"; do
            docker buildx imagetools create \
              -t ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:${TAG} \
              -t ${{ env.REGISTRY_DOCKERHUB }}/${{ env.IMAGE_NAME }}:${TAG} \
              ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:${VERSION}-amd64${{ matrix.suffix }} \
              ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:${VERSION}-arm64${{ matrix.suffix }}
          done

  closure-check:
    name: Feature closure tests (dev)
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Run feature closure tests
        run: |
          cargo test -p camel-cli --test feature_profiles
          # Slim fail-closed security rejection re-validated on every dev
          # run (distribution-flavors R3). The grep guards against a
          # vacuous 0-matched pass (cargo exits 0 when no test matches the
          # filter; a rename would silently disable this gate).
          OUT="$(cargo test -p camel-bundles --lib security_omission_fails_closed 2>&1)"
          printf '%s\n' "$OUT"
          printf '%s\n' "$OUT" | grep -q '1 passed' || {
            echo "FAIL: security_omission_fails_closed did not run exactly once"
            exit 1
          }
