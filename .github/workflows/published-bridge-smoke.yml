# Published CXF Bridge Smoke — release verification, NOT a PR gate.
#
# Why this exists (bd rc-cln4q): every CI job builds the bridge locally and
# tests that binary. None of them ever downloads what users actually get from
# the GitHub release. The 0.8.2 repro proved that gap is a real failure class:
# "works in our build, fails in what users download", usually from release
# build flags (GraalVM version, native-image options, packaging).
#
# Trigger wiring: chained after the "CXF Bridge Release" workflow
# (.github/workflows/cxf-bridge-release.yml, tag `cxf-bridge-v*`), which creates
# the GitHub Release with the tarballs. That workflow does not expose the tag on
# `github.event.release`, so this job resolves it from `workflow_run.head_branch`
# and falls back to the newest `cxf-bridge-v*` release. `workflow_dispatch`
# allows re-running the verification without cutting a new release (pass
# `bridge_version`, with or without the `cxf-bridge-v` prefix).
#
# Download URL shape (mirrors crates/services/camel-bridge/src/download.rs:253):
#   https://github.com/kennycallado/rust-camel/releases/download/cxf-bridge-v<VER>/cxf-bridge-<VER>-linux-musl-x86_64.tar.gz
#
# Expected runtime: ~10-20 min cold (compiling the camel-test `cxf_test`
# target) plus the e2e subset (three tests, each spawning the native bridge).
#
# Scope of the smoke: the legacy SHA-1 boundary (LEG C: opted-in accepts,
# default rejects) AND the mainstream SHA-2 round trip (LEG A producer signing
# + LEG B consumer verification, in `cxf_native_wss_signed_call_and_verified_signer`),
# all against the published binary.
#
# How to read a failure:
#   - Download/checksum failure: the release is incomplete or corrupted.
#   - LEG A or LEG C failure: the PUBLISHED artifact regressed. Check the
#     release build flags (GraalVM/native-image config, profile env emission),
#     not the source code — locally built binaries still pass these tests in CI.

name: Published CXF Bridge Smoke

on:
  workflow_run:
    workflows: ["CXF Bridge Release"]
    types: [completed]
    branches:
      - 'cxf-bridge-v*'
  workflow_dispatch:
    inputs:
      bridge_version:
        description: 'Bridge version (e.g. 0.8.2 or cxf-bridge-v0.8.2). Empty = newest cxf-bridge release.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: published-bridge-smoke-${{ github.event.inputs.bridge_version || github.event.workflow_run.head_branch || 'latest' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Same disk mitigation as ci.yml full-tests-linux.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  smoke:
    name: Published binary smoke (linux-musl-x86_64)
    # Only smoke successful releases; manual dispatch is always allowed.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The published asset is a GraalVM native image, but keep the JDK in the
      # environment: it matches the toolchain used to build the bridge and
      # catches any JVM-dependent path the native image might still take.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install libclang for bindgen
        run: sudo apt-get install -y libclang-dev

      - name: Resolve bridge version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRIDGE_VERSION_INPUT: ${{ github.event.inputs.bridge_version }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${BRIDGE_VERSION_INPUT:-}"
          if [[ -z "$version" && "$EVENT_NAME" == "workflow_run" ]]; then
            version="${WORKFLOW_RUN_BRANCH:-}"
          fi
          if [[ -z "$version" ]]; then
            version="$(gh api "repos/${REPO}/releases" --paginate \
              --jq '.[].tag_name' | grep -E '^cxf-bridge-v[0-9]' | head -n1 || true)"
          fi
          version="${version#cxf-bridge-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Could not resolve a cxf-bridge version (got '$version')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved bridge version: $version"

      - name: Download published linux-musl artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          asset="cxf-bridge-${VERSION}-linux-musl-x86_64.tar.gz"
          tag="cxf-bridge-v${VERSION}"
          url="https://github.com/${REPO}/releases/download/${tag}/${asset}"
          echo "Downloading $url"
          mkdir -p published
          gh release download "$tag" --pattern "$asset" --dir published
          gh release download "$tag" --pattern "cxf-bridge-${VERSION}-SHA256SUMS" --dir published
          cd published
          grep " ${asset}$" "cxf-bridge-${VERSION}-SHA256SUMS" | sha256sum -c -
          tar -xzf "$asset"
          test -x "cxf-bridge-${VERSION}-linux-musl-x86_64/bin/cxf-bridge"
          echo "CAMEL_CXF_BRIDGE_BINARY_PATH=$PWD/cxf-bridge-${VERSION}-linux-musl-x86_64/bin/cxf-bridge" >> "$GITHUB_ENV"

      - name: WSS e2e subset (LEG A + LEG C) against the published binary
        shell: bash
        run: |
          set -euo pipefail
          # `cargo test <filter>` exits 0 when the filter matches zero tests, so
          # assert every expected test actually ran. Without this, a future
          # rename would silently neuter the smoke job (vacuous pass).
          set +e
          out="$(cargo test -p camel-test --features integration-tests --test cxf_test \
            -- wss_e2e_leg_c cxf_native_wss_signed_call_and_verified_signer --nocapture 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$out"
          for name in \
            cxf_native_wss_signed_call_and_verified_signer \
            wss_e2e_leg_c_opted_in_profile_accepts_legacy_sha1 \
            wss_e2e_leg_c_default_profile_rejects_legacy_sha1; do
            if ! grep -q "$name" <<<"$out"; then
              echo "::error::test '$name' did not run — filter matched zero tests or the test was renamed"
              exit 1
            fi
          done
          exit "$status"
