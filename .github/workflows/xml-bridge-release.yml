name: XML Bridge Release

on:
  push:
    tags:
      - 'xml-bridge-v*'


permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Check bridge tag against registry
        run: cargo xtask lint-bridge-versions --tag "$GITHUB_REF_NAME"

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            target: linux-musl-x86_64
            build_method: docker
          - os: macos-arm
            runner: macos-latest
            target: macos-aarch64
            build_method: native
          - os: windows
            runner: windows-latest
            target: windows-x86_64
            build_method: native

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Setup GraalVM (native builds)
        if: matrix.build_method == 'native'
        uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          # keep in sync with the builder image tag in bridges/README.md
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Activate MSVC (Windows only)
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Cache Gradle dependencies (Docker)
        if: matrix.build_method == 'docker'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bridges/xml/.gradle-docker-cache
          key: gradle-${{ hashFiles('bridges/xml/build.gradle.kts', 'bridges/xml/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Cache Gradle dependencies (native)
        if: matrix.build_method == 'native'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bridges/xml/.gradle-local-cache
          key: gradle-native-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('bridges/xml/build.gradle.kts', 'bridges/xml/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-native-${{ runner.os }}-${{ matrix.target }}-

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#xml-bridge-v}" >> $GITHUB_OUTPUT

      - name: Build native bridge (Docker)
        if: matrix.build_method == 'docker'
        run: cargo xtask build-xml-bridge --version ${{ steps.version.outputs.version }}

      - name: Build native bridge (native)
        if: matrix.build_method == 'native'
        run: cargo xtask build-bridge-native --bridge xml --version ${{ steps.version.outputs.version }} --target ${{ matrix.target }}

      - name: Verify static binary (Linux only)
        if: matrix.os == 'linux'
        run: |
          BINARY=$(find bridges/xml/build/native -name 'xml-bridge' -type f)
          if readelf -l "$BINARY" | grep -q "Requesting program interpreter"; then
            echo "::error::Binary is NOT statically linked"
            exit 1
          fi
          echo "Verified: statically linked"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bridge-${{ matrix.target }}
          path: |
            bridges/xml/build/release/*.tar.gz*
            bridges/xml/build/release/*.zip*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bridge-*
          merge-multiple: true
          path: artifacts/

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#xml-bridge-v}" >> $GITHUB_OUTPUT

      - name: Create SHA256SUMS
        run: |
          cd artifacts
          VERSION="${{ steps.version.outputs.version }}"
          sha256sum *.tar.gz *.zip > "xml-bridge-${VERSION}-SHA256SUMS"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/xml-bridge-*-SHA256SUMS
          generate_release_notes: true
          body: |
            ## XML Bridge ${{ github.ref_name }}

            **Dependency updates:**
            - Saxon-HE 12.5 -> 12.7 (XSLT 2.0/3.0 engine).

            **Platforms:
            - `linux-musl-x86_64` — statically linked, any Linux (Alpine, Ubuntu, NixOS, scratch)
            - `macos-aarch64` — Apple Silicon (M1/M2/M3+)
            - `windows-x86_64` — Windows 10/11

            **No shared library dependencies on Linux.**
            **No JVM required — binaries are native images.**

      - name: Verify release assets
        # bd rc-qd3ug: independent post-upload gate for the rc-6ep0i class of
        # silent asset loss (eventual-consistency 404 treated as success).
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: scripts/verify-release-assets.sh "$GITHUB_REF_NAME" artifacts
