name: fuzz-smoke

# Non-blocking fuzz smoke (openspec/changes/fuzz-smoke-ci). CI runs the
# `cargo xtask fuzz` wrapper exactly like a developer (design D2): the
# refusal drill is free in the GitHub checkout; real runs execute from a
# linked worktree so instrumented builds, corpus, and artifacts stay out
# of the checkout. Drill/audit steps never fail themselves — they append
# `PASS/FAIL <name>` lines to $RUNNER_TEMP/findings.md and end with
# `exit 0`; only the summary step (if: always()) exits non-zero, which
# job-level continue-on-error renders as an annotation, not a red X.

on:
  pull_request:
    branches: ["main"]
    paths:
      - "crates/camel-dsl/**"
      - "fuzz/**"
      - "scripts/xtask/**"
      - ".github/workflows/fuzz-smoke.yml"
  workflow_dispatch:
    inputs:
      time:
        description: seconds per target
        type: number
        default: 60

permissions:
  contents: read

concurrency:
  group: fuzz-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  # Newest crates.io stable cargo-fuzz (2026-06-09) — never `latest`.
  CARGO_FUZZ_VERSION: "0.13.2"
  SMOKE_TIME: ${{ inputs.time || 60 }}

jobs:
  fuzz-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    # Dispatch runs all four legs plus the drills; PRs run only the
    # selected legs, so the budget scales with the event.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 30 || 20 }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so leg selection can diff the PR against its
          # base commit (scripts/fuzz-legs.sh consumes the path list).
          fetch-depth: 0

      - id: cold-baseline
        name: Cold baseline (fresh checkout has no ./target)
        run: |
          mkdir -p "$RUNNER_TEMP/fuzz-smoke-state" && : > "$RUNNER_TEMP/findings.md"
          if [ ! -d ./target ]; then
            echo "PASS cold-baseline" >> "$RUNNER_TEMP/findings.md"
          else
            echo "FAIL cold-baseline ./target exists in fresh checkout" >> "$RUNNER_TEMP/findings.md"
          fi

      - id: nightly
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # nightly
        with:
          # Pinned date, kept in lockstep with the flake fuzzNightly
          # (rc-p957): one nightly across local and CI keeps crash repros
          # portable and stops fingerprint churn from evicting warm caches
          # on every run.
          toolchain: nightly-2026-08-27

      - id: cache-week
        name: Weekly cache rotation suffix
        run: echo "week=$(date -u +%GW%V)" >> "$GITHUB_OUTPUT"

      - id: cache-cargo-fuzz
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Dedicated --root, physically separated from the rustup proxies
          # and from rust-cache's ~/.cargo domain: rust-cache's post-job
          # (which runs before this action's post, post-jobs are reversed)
          # prunes ~/.cargo/bin and once archived a cargo-fuzz-less dir
          # (rc-md2b). The old cargo-fuzz-* key must never be reused —
          # cache entries are immutable.
          path: ${{ runner.temp }}/cargo-fuzz-root
          key: cargo-fuzz-root-${{ env.CARGO_FUZZ_VERSION }}-${{ runner.os }}

      - id: install-cargo-fuzz
        if: steps.cache-cargo-fuzz.outputs.cache-hit != 'true'
        name: Install cargo-fuzz (single install path, pinned version)
        run: |
          cargo install cargo-fuzz --locked --version "${CARGO_FUZZ_VERSION}" \
            --root "$RUNNER_TEMP/cargo-fuzz-root"

      - id: cargo-fuzz-path
        name: Put cargo-fuzz on PATH (restore or install, same location)
        run: echo "$RUNNER_TEMP/cargo-fuzz-root/bin" >> "$GITHUB_PATH"

      - id: cache-xtask
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Warm the xtask binary build (both drills share this target dir;
          # the wrapper's instrumented builds override CARGO_TARGET_DIR
          # explicitly, so this never touches target-fuzz). Weekly key
          # rotation caps quota churn (e_opus amendment, rc-7rw2 closure).
          path: ${{ runner.temp }}/xtask-build
          key: xtask-nightly-2026-08-27-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-w${{ steps.cache-week.outputs.week }}
          restore-keys: |
            xtask-nightly-2026-08-27-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-

      - id: verify-cargo-fuzz
        name: Verify cargo-fuzz version (fails the job on drift, cached or fresh)
        run: |
          command -v cargo-fuzz || true
          ls -l "$RUNNER_TEMP/cargo-fuzz-root/bin" || true
          cargo +nightly fuzz --version | grep -q "${CARGO_FUZZ_VERSION}"

      - id: rust-cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          # Registry/git cache only — a restored checkout ./target would
          # violate the cold-main assertion, and the instrumented worktree
          # build is deliberately scratch (design D5).
          cache-targets: false

      - id: select-legs
        name: Select smoke legs from changed paths
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            legs=$(./scripts/fuzz-legs.sh --dispatch)
          else
            git fetch origin "${{ github.event.pull_request.base.sha }}"
            legs=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"..HEAD \
              | ./scripts/fuzz-legs.sh)
          fi
          echo "FUZZ_LEGS=$legs" >> "$GITHUB_ENV"

      - id: refusal
        name: Refusal drill (wrapper refuses the main checkout)
        run: |
          set +e
          t0=$(date +%s)
          CARGO_TARGET_DIR="$RUNNER_TEMP/xtask-build" \
            cargo run --package xtask -- fuzz dsl_yaml \
            > "$RUNNER_TEMP/fuzz-smoke-state/refusal.log" 2>&1
          ec=$?
          echo "refusal-drill $(( $(date +%s) - t0 ))s" >> "$RUNNER_TEMP/fuzz-smoke-state/durations.txt"
          detail=""
          if [ "$ec" -ne 1 ]; then
            detail="exit=$ec (want 1); "
          fi
          if ! grep -q "refusing: cargo xtask fuzz must run in a linked worktree" \
            "$RUNNER_TEMP/fuzz-smoke-state/refusal.log"; then
            detail="${detail}guard message missing; "
          fi
          if [ -d ./target ]; then
            detail="${detail}./target created in checkout; "
          fi
          if [ -z "$detail" ]; then
            echo "PASS refusal-drill" >> "$RUNNER_TEMP/findings.md"
          else
            echo "FAIL refusal-drill $detail" >> "$RUNNER_TEMP/findings.md"
          fi
          exit 0

      - id: worktree
        name: Create linked worktree for real runs
        run: git worktree add "$RUNNER_TEMP/fuzz-wt" HEAD

      - id: cache-asan
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Scoped ASAN instrumented build cache (e_opus amendment):
          # deps/build only — final binaries relink fast and would bloat
          # the entry. Separate from rust-cache (which owns only
          # registry/git here, cache-targets: false) and rotated weekly to
          # cap quota churn against the 10 GB repo budget.
          path: |
            ${{ runner.temp }}/fuzz-wt/target-fuzz/x86_64-unknown-linux-gnu/release/deps
            ${{ runner.temp }}/fuzz-wt/target-fuzz/x86_64-unknown-linux-gnu/release/build
          key: fuzz-asan-nightly-2026-08-27-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.lock') }}-w${{ steps.cache-week.outputs.week }}
          restore-keys: |
            fuzz-asan-nightly-2026-08-27-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.lock') }}-

      - id: smoke
        name: Smoke drill (serial legs from the worktree)
        run: |
          set +e
          cd "$RUNNER_TEMP/fuzz-wt"
          detail=""
          smoked=0
          for leg in $FUZZ_LEGS; do
            smoked=$((smoked + 1))
            t0=$(date +%s)
            ec=0
            CARGO_TARGET_DIR="$RUNNER_TEMP/xtask-build" \
              cargo run --package xtask -- fuzz "$leg" --time "$SMOKE_TIME" \
              > "smoke-$leg.log" 2>&1 || ec=$?
            echo "smoke:$leg $(( $(date +%s) - t0 ))s" >> "$RUNNER_TEMP/fuzz-smoke-state/durations.txt"
            leg_detail=""
            if [ "$ec" -ne 0 ]; then
              leg_detail="exit=$ec (want 0); "
            fi
            if ! find "target-fuzz/corpus/$leg" -type f 2>/dev/null | grep -q .; then
              leg_detail="${leg_detail}corpus target-fuzz/corpus/$leg not populated; "
            fi
            if ls "target-fuzz/artifacts/$leg"/crash-* >/dev/null 2>&1; then
              leg_detail="${leg_detail}crash artifact produced; "
            fi
            if [ -n "$leg_detail" ]; then
              detail="${detail}$leg: $leg_detail"
            fi
          done
          if [ "$smoked" -eq 0 ]; then
            detail="no legs selected (FUZZ_LEGS empty); "
          fi
          cd "$GITHUB_WORKSPACE"
          if [ -d ./target ]; then
            detail="${detail}./target created in checkout; "
          fi
          if [ -z "$detail" ]; then
            echo "PASS smoke" >> "$RUNNER_TEMP/findings.md"
          else
            echo "FAIL smoke $detail" >> "$RUNNER_TEMP/findings.md"
          fi
          exit 0

      - id: tmin
        name: tmin drill (injected panic is caught and minimized)
        run: |
          set +e
          cd "$RUNNER_TEMP/fuzz-wt"
          # Panic injection touches the WORKTREE copy only; the worktree is
          # discarded after the job, so it can never reach any ref.
          sed -i 's|camel_fuzz::dsl_json_harness(data);|panic!("fuzz-smoke drill"); camel_fuzz::dsl_json_harness(data);|' \
            "$RUNNER_TEMP/fuzz-wt/fuzz/fuzz_targets/dsl_json.rs"
          t0=$(date +%s)
          # 20 s is intentionally fixed and independent of inputs.time:
          # the drill wants a short bounded budget, not a long minimization.
          CARGO_TARGET_DIR="$RUNNER_TEMP/xtask-build" \
            cargo run --package xtask -- fuzz dsl_json --time 20 > tmin.log 2>&1
          ec=$?
          echo "tmin-drill $(( $(date +%s) - t0 ))s" >> "$RUNNER_TEMP/fuzz-smoke-state/durations.txt"
          detail=""
          if [ "$ec" -eq 0 ]; then
            detail="exit=0 (want non-zero); "
          fi
          for pat in "new artifact(s):" "minimized artifact:" "promote this input"; do
            if ! grep -qF "$pat" tmin.log; then
              detail="${detail}log missing '${pat}'; "
            fi
          done
          # An always-panicking harness crashes on the empty input first
          # (crash-da39a3ee... is SHA1 of 0 bytes); `tmin -minimize_crash`
          # writes no minimized-from-* for a 0-byte input — the wrapper
          # reports the original as already minimal instead.
          if ! find "$RUNNER_TEMP/fuzz-wt/target-fuzz/artifacts/dsl_json" \
            -maxdepth 1 -type f -name 'minimized-from-*' 2>/dev/null | grep -q . \
            && ! grep -qF 'already minimal' tmin.log; then
            detail="${detail}no minimized-from-* artifact and no already-minimal marker; "
          fi
          # cargo-fuzz creates fuzz/artifacts/<target>/ unconditionally
          # (project.rs artifacts_for does create_dir_all on every run);
          # only FILES there indicate writes outside target-fuzz/.
          if find "$RUNNER_TEMP/fuzz-wt/fuzz/artifacts" -type f 2>/dev/null | grep -q .; then
            detail="${detail}files under fuzz/artifacts/ (minimizer wrote outside target-fuzz/); "
          fi
          cd "$GITHUB_WORKSPACE"
          if [ "$(git status --porcelain | wc -l)" -ne 0 ]; then
            detail="${detail}checkout dirty after worktree-only patch; "
          fi
          if [ -d ./target ]; then
            detail="${detail}./target created in checkout; "
          fi
          if [ -z "$detail" ]; then
            echo "PASS tmin-drill" >> "$RUNNER_TEMP/findings.md"
          else
            echo "FAIL tmin-drill $detail" >> "$RUNNER_TEMP/findings.md"
          fi
          exit 0

      - id: install-cargo-audit
        uses: taiki-e/install-action@eba66cc6f87204a1e73f96e528e759b6c1fcf573 # cargo-audit
        with:
          tool: cargo-audit

      - id: audit
        name: Fuzz lockfile audit (advisories are findings, not gates — design D4)
        run: |
          set +e
          cargo audit --file fuzz/Cargo.lock > "$RUNNER_TEMP/fuzz-smoke-state/audit.log" 2>&1
          ec=$?
          detail=""
          if [ "$ec" -ne 0 ]; then
            detail="cargo audit exit=$ec (advisories — see audit.log); "
          fi
          if [ -d ./target ]; then
            detail="${detail}./target created in checkout; "
          fi
          if [ -z "$detail" ]; then
            echo "PASS fuzz-lock-audit" >> "$RUNNER_TEMP/findings.md"
          else
            echo "FAIL fuzz-lock-audit $detail" >> "$RUNNER_TEMP/findings.md"
          fi
          exit 0

      - id: summary
        if: always()
        name: Summarize findings (only step that may exit non-zero)
        run: |
          if [ -d ./target ]; then
            echo "FAIL cold-main-final ./target exists at summary" >> "$RUNNER_TEMP/findings.md"
          else
            echo "PASS cold-main-final" >> "$RUNNER_TEMP/findings.md"
          fi
          findings="$RUNNER_TEMP/findings.md"
          missing=""
          for name in cold-baseline refusal-drill smoke tmin-drill fuzz-lock-audit cold-main-final; do
            if ! grep -qE "^(PASS|FAIL) $name( |$)" "$findings"; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            {
              echo "## fuzz-smoke: infrastructure failure"
              echo ""
              echo "infrastructure failure — checks skipped:$missing"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "infrastructure failure — checks skipped:$missing"
            exit 1
          fi
          failing=$(grep "^FAIL" "$findings" || true)
          if [ -n "$failing" ]; then
            {
              echo "## fuzz-smoke: drill findings"
              echo ""
              echo "### Failing checks"
              echo ""
              echo '```'
              echo "$failing"
              echo '```'
              echo ""
              echo "### Artifact paths"
              echo ""
              for leg in $FUZZ_LEGS; do
                if find "$RUNNER_TEMP/fuzz-wt/target-fuzz/artifacts/$leg" \
                  -maxdepth 1 -type f 2>/dev/null | grep -q .; then
                  echo "Under the worktree: \`target-fuzz/artifacts/$leg/\`"
                  if [ "$leg" = "dsl_json" ]; then
                    echo "Note: crash-da39a3ee5e6b4b0d3255bfef95601890afd80709 is the tmin drill's known empty-input artifact (injected panic), not a product crash."
                  fi
                  echo ""
                  echo '```'
                  ls "$RUNNER_TEMP/fuzz-wt/target-fuzz/artifacts/$leg" 2>/dev/null || echo "(none)"
                  echo '```'
                  echo ""
                fi
              done
              echo "### Promotion instruction"
              echo ""
              echo "Promote a minimized input as a committed \`#[test]\` in \`crates/camel-dsl\` — never a raw corpus blob."
              echo ""
              echo "### Triage"
              echo ""
              echo "File the bug: \`bd create -t bug -p 1\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo "## fuzz-smoke: all clear"
            echo ""
            echo "All six checks passed."
            echo ""
            echo "### Measured durations"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/fuzz-smoke-state/durations.txt" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
