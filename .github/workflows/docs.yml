name: Documentation

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "examples/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "docs/**"
      - "examples/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTDOCFLAGS: "-D warnings"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install documentation tools
        uses: taiki-e/install-action@eba66cc6f87204a1e73f96e528e759b6c1fcf573 # cargo-binstall
        with:
          tool: mdbook@0.4.52,lychee@0.20.1
      - name: Build Rustdoc
        run: |
          cargo doc \
            -p camel-api \
            -p camel-core \
            -p camel-builder \
            -p camel-dsl \
            -p camel-endpoint \
            --no-deps
      - name: Test Rustdoc examples
        run: |
          cargo test \
            -p camel-api \
            -p camel-core \
            -p camel-builder \
            -p camel-dsl \
            -p camel-endpoint \
            --doc
      - name: Compile guide Rust examples
        run: cargo check -p hello-world -p config-basic
      - name: Validate guide YAML examples
        run: cargo test -p camel-dsl --test documentation_examples
      - name: Build and test guide
        run: |
          mdbook build docs
          mdbook test docs
      - name: Build Pages artifact
        run: scripts/build-pages.sh
      - name: Check rendered site links
        run: lychee --offline --no-progress pages-artifact

  # Deploy gates on validate: a red validation run can never publish a
  # broken site (fixes the 2026-08-10 incident class where the old
  # pages.yml deployed while docs.yml was red). Builds the guide from the
  # same commit that passed validation.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mdBook
        uses: taiki-e/install-action@eba66cc6f87204a1e73f96e528e759b6c1fcf573 # cargo-binstall
        with:
          tool: mdbook@0.4.52
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build guide
        run: |
          mdbook build docs
          scripts/build-pages.sh
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-artifact
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
