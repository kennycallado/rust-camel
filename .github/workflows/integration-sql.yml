name: Integration SQL

on:
  pull_request:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/components/camel-sql/**"
      - "crates/camel-integration-test/**"
      - "crates/camel-bundles/**"
      - "crates/camel-cli/src/**"
      - "crates/camel-cli/tests/test_scenario_cli_e2e.rs"
      - "crates/camel-cli/Cargo.toml"
      - ".github/workflows/integration-sql.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # ENOSPC mitigation: strip debug info from dev/test profiles.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  integration-sql:
    name: Integration SQL independence (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/google/chrome /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h /
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: SQL independence proof (camel-cli, no default features)
        run: >
          cargo test -p camel-cli --no-default-features
          --features integration-sql,itest-e2e
          --test test_scenario_cli_e2e
