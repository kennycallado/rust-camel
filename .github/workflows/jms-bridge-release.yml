name: JMS Bridge Release

on:
  push:
    tags:
      - 'jms-bridge-v*'


permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            target: linux-musl-x86_64
            build_method: docker
          - os: macos-arm
            runner: macos-latest
            target: macos-aarch64
            build_method: native
          - os: windows
            runner: windows-latest
            target: windows-x86_64
            build_method: native

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Setup GraalVM (native builds)
        if: matrix.build_method == 'native'
        uses: graalvm/setup-graalvm@0def53c0fd8534bc13416c9469f5be45265824fd # v1.6.3
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Activate MSVC (Windows only)
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Cache Gradle dependencies (Docker)
        if: matrix.build_method == 'docker'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bridges/jms/.gradle-docker-cache
          key: gradle-${{ hashFiles('bridges/jms/build.gradle.kts', 'bridges/jms/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Cache Gradle dependencies (native)
        if: matrix.build_method == 'native'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bridges/jms/.gradle-local-cache
          key: gradle-native-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('bridges/jms/build.gradle.kts', 'bridges/jms/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-native-${{ runner.os }}-${{ matrix.target }}-

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#jms-bridge-v}" >> $GITHUB_OUTPUT

      - name: Build native bridge (Docker)
        if: matrix.build_method == 'docker'
        run: cargo xtask build-jms-bridge --version ${{ steps.version.outputs.version }}

      - name: Build native bridge (native)
        if: matrix.build_method == 'native'
        run: cargo xtask build-bridge-native --bridge jms --version ${{ steps.version.outputs.version }} --target ${{ matrix.target }}

      - name: Verify static binary (Linux only)
        if: matrix.os == 'linux'
        run: |
          BINARY=$(find bridges/jms/build/native -name 'jms-bridge' -type f)
          if readelf -l "$BINARY" | grep -q "Requesting program interpreter"; then
            echo "::error::Binary is NOT statically linked"
            exit 1
          fi
          echo "Verified: statically linked"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-${{ matrix.target }}
          path: |
            bridges/jms/build/release/*.tar.gz*
            bridges/jms/build/release/*.zip*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bridge-*
          merge-multiple: true
          path: artifacts/

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#jms-bridge-v}" >> $GITHUB_OUTPUT

      - name: Create SHA256SUMS
        run: |
          cd artifacts
          VERSION="${{ steps.version.outputs.version }}"
          sha256sum *.tar.gz *.zip > "jms-bridge-${VERSION}-SHA256SUMS"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/jms-bridge-*-SHA256SUMS
          generate_release_notes: true
          body: |
            ## JMS Bridge ${{ github.ref_name }}

            **Platforms:**
            - `linux-musl-x86_64` — statically linked, any Linux (Alpine, Ubuntu, NixOS, scratch)
            - `macos-aarch64` — Apple Silicon (M1/M2/M3+)
            - `windows-x86_64` — Windows 10/11

            **No shared library dependencies on Linux.**
            **No JVM required — binaries are native images.**
