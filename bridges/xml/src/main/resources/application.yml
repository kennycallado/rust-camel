quarkus:
  grpc:
    server:
      port: 9090
      # Control-plane gRPC requests from the Rust runtime. A legal 8 MiB XSD
      # root appears in both schema and resources; 17 MiB leaves room for the
      # protobuf envelope. Decoded schema-set byte/count/alias caps stay unchanged.
      # Keep ingress synchronized with XSD_BRIDGE_MAX_REGISTER_REQUEST_SIZE.
      # Rust response decoding also stays at 17 MiB; transform outputs beyond
      # that ceiling fail with a decode error, independently of this input cap.
      max-inbound-message-size: 17825792
      use-separate-server: false
      plain-text: false
  http:
    port: -1
    ssl-port: ${QUARKUS_HTTP_SSL_PORT:8443}
    insecure-requests: disabled
    ssl:
      client-auth: REQUIRED
    tls-configuration-name: bridge
  log:
    console:
      json:
        enabled: true
  otel:
    # Escalon 3 (rc-cuteb): own OTel pipeline. Egress is FAIL-CLOSED:
    # the OTLP exporter ships enabled at build time, so the SDK is off by
    # default and OtlpEgressGuard refuses to start when the SDK is on
    # without an explicit traces endpoint — the exporter's built-in
    # http://localhost:4317 fallback must never dial silently (same
    # doctrine as the Rust-side egress allowlist, 69a7f143 / rc-uctc).
    # Operator opt-in (both required, runtime env):
    #   QUARKUS_OTEL_SDK_DISABLED=false
    #   QUARKUS_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://<collector>:4317
    sdk:
      disabled: true
  tls:
    bridge:
      key-store:
        pem:
          "0":
            cert: ${QUARKUS_TLS_BRIDGE_KEY_STORE_PEM_0_CERT:tls/placeholder-server.pem}
            key: ${QUARKUS_TLS_BRIDGE_KEY_STORE_PEM_0_KEY:tls/placeholder-server.key}
      trust-store:
        pem:
          certs: ${QUARKUS_TLS_BRIDGE_TRUST_STORE_PEM_CERTS:tls/placeholder-ca.pem}
  native:
    resources:
      includes:
        # Xerces diagnostic bundles. Re-verify these globs on a xercesImpl bump:
        #   unzip -l xercesImpl-*.jar | grep '\.properties'
        # They MUST live here: bundle entries placed in the application's own
        # META-INF/native-image/resource-config.json did not reach the native
        # image (verified with glob and with pattern entries), so a bundle
        # listed only there is absent and Xerces reports "Installation Problem???".
        - org/apache/xerces/impl/msg/*
        - org/apache/xerces/impl/xpath/regex/message*.properties
        - application.yml
        - tls/placeholder-ca.pem
        - tls/placeholder-server.pem
        - tls/placeholder-server.key
    # NOTE: quarkus.native.additional-build-args is intentionally NOT set here.
    # It is provided solely via the QUARKUS_NATIVE_ADDITIONAL_BUILD_ARGS env var
    # in build-native.sh. Setting it in BOTH places makes SmallRye prioritize the
    # YAML *indexed* form ([0]..[n]) over the env-var comma form, which silently
    # DROPS the trailing --static,--libc=musl args and yields a glibc-dynamic
    # binary. Keep all native-image args in the env var only.

# Compiled-schema cache bound. Registered schema-set entries are pinned and never
# evicted; inline entries evict oldest-inserted-first. A non-positive value fails
# startup (fail-loud).
xml-bridge:
  schema-cache:
    max-entries: 256

"%test":
  quarkus:
    http:
      ssl-port: -1
      insecure-requests: enabled
      ssl:
        client-auth: none
    grpc:
      server:
        plain-text: true
        use-separate-server: true
    tls:
      bridge:
        key-store:
          pem:
            "0":
              cert: tls/test-server.pem
              key: tls/test-server.key
        trust-store:
          pem:
            certs: tls/test-ca.pem
  # Small bound so integration tests exercise eviction with a few inserts.
  # All %test classes share one Quarkus boot: tests must measure cache size and
  # eviction deltas from a baseline captured inside the test; registered schema
  # sets pin their digests for the whole suite boot.
  xml-bridge:
    schema-cache:
      max-entries: 8
